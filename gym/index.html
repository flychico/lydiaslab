<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MichelAngelo — Workout Planner & Meal Tracker</title>
<meta name="description" content="Personal strength training planner, workout log, and nutrition tracker. Every block of stone has a statue inside it.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f8fa">
<link rel="manifest" href="/gym/manifest.json">
<link rel="apple-touch-icon" href="/gym/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128511;</text></svg>">
<style>
/* LyDia palette — light (default) */
:root{
  --bg:#f6f8fa;--bg2:#eef1f4;--card:#ffffff;--border:#d0d7de;
  --text:#1f2328;--dim:#57606a;
  --pink:#d6508e;--blue:#4d9fdc;
  --green:#1e8e3e;--red:#cf222e;--gold:#9a6700;--radius:12px;
  --shadow:0 1px 3px rgba(31,35,40,.08);
}
[data-theme=dark]{
  --bg:#0d1220;--bg2:#121a2e;--card:#171f36;--border:#26314f;
  --text:#e8edf6;--dim:#8b9ab5;
  --pink:#e56ba3;--blue:#5daae6;
  --green:#3ddc84;--red:#ff5d5d;--gold:#ffce4d;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px;min-height:100vh;transition:background .2s}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font-size:1.5rem;margin-bottom:2px}
h1 .mich{color:var(--blue)}h1 .angelo{color:var(--pink)}
h2{font-size:1.15rem;margin:18px 0 10px}
h3{font-size:1rem}
.dim{color:var(--dim)}.small{font-size:.83rem}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.pink{color:var(--pink)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:inline-block;background:var(--pink);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.full{width:100%}
.btn.blue-btn{background:var(--blue)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.small-btn{padding:7px 12px;font-size:.85rem;border-radius:8px}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
input,select{background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:1rem;padding:10px 12px;width:100%}
input:focus{outline:none;border-color:var(--blue)}
input[type=number]{text-align:center;font-weight:700;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--dim);margin:12px 0 5px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{flex:1;text-align:center;padding:11px 0 9px;font-size:.72rem;color:var(--dim);cursor:pointer;font-weight:600}
.tabbar div.on{color:var(--pink)}
.tabbar .ico{font-size:1.25rem;display:block;margin-bottom:1px}
.pill{display:inline-block;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:.8rem;font-weight:700;margin:0 6px 6px 0;color:var(--dim);cursor:pointer}
.pill.on{background:var(--pink);border-color:var(--pink);color:#fff}
.setrow{display:grid;grid-template-columns:34px 1fr 16px 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .setnum{color:var(--dim);font-weight:700;font-size:.9rem;text-align:center}
.setrow .x{color:var(--dim);text-align:center}
.chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:transparent;font-size:1.15rem;font-weight:900;cursor:pointer}
.chk.done{background:var(--green);border-color:var(--green);color:#fff}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.lastinfo{font-size:.8rem;color:var(--dim);margin-bottom:8px}
.suggest{font-size:.83rem;color:var(--gold);font-weight:600;margin-bottom:8px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.statgrid .card{margin:0;text-align:center;padding:12px 8px}
.statgrid .big{font-size:1.45rem;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{color:var(--dim);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 6px}
td{padding:7px 6px;border-top:1px solid var(--border)}
.num{text-align:right}
.hidden{display:none!important}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:700;padding:10px 20px;border-radius:24px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.timer{position:fixed;bottom:64px;left:0;right:0;background:var(--blue);color:#fff;font-weight:800;text-align:center;padding:9px;z-index:49;font-size:1rem;cursor:pointer;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.swaplist{max-height:340px;overflow-y:auto}
.swaplist .card{padding:10px 12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal>.inner{background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:82vh;overflow-y:auto}
canvas{width:100%;height:150px}
.daycard{cursor:pointer}
.exline{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);font-size:.9rem}
.exline:first-of-type{border-top:none}
.qopt{margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.quote{font-style:italic;color:var(--dim);font-size:.86rem;border-left:3px solid var(--pink);padding-left:10px;margin:10px 0}
textarea{background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:1rem;padding:10px 12px;width:100%;font-family:inherit}
.dashgrid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.dashwide{grid-column:1/-1}
.tabbar .deskonly{display:none}
.progress-bar{width:100%;height:8px;background:var(--bg2);border-radius:4px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.macroRow{display:flex;justify-content:space-between;font-size:.9rem;padding:6px 0}
.macroVal{font-weight:600;color:var(--pink)}
/* ---- Wide-screen dashboard layout (phone is untouched) ---- */
@media(min-width:900px){
  body{padding-bottom:0;padding-left:220px}
  .wrap{max-width:1060px;padding:30px 40px}
  body.dashmode .wrap{max-width:1280px}
  .tabbar{top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-top:none;border-right:1px solid var(--border);padding:22px 12px;align-items:stretch;gap:4px}
  .tabbar .deskonly{display:flex}
  .tabbar div{flex:0 0 auto;text-align:left;padding:12px 15px;font-size:.95rem;display:flex;align-items:center;gap:11px;border-radius:10px}
  .tabbar div.on{background:var(--bg2);color:var(--pink)}
  .tabbar .ico{display:inline;margin:0;font-size:1.15rem}
  .dashgrid{grid-template-columns:1fr 1fr;gap:20px}
  .timer{left:220px}
  .toast{left:calc(50% + 110px)}
  .modal{align-items:center}
  .modal>.inner{border-radius:18px;max-width:660px}
  h2{margin-top:22px}
  #view .card{padding:18px 20px}
  body:not(.dashmode):not(.workout) #view{column-count:2;column-gap:30px}
  body:not(.dashmode):not(.workout) #view h1,
  body:not(.dashmode):not(.workout) #view h2{column-span:all;margin-top:8px}
  body:not(.dashmode):not(.workout) #view .card,
  body:not(.dashmode):not(.workout) #view .statgrid,
  body:not(.dashmode):not(.workout) #view .quote{break-inside:avoid;margin-bottom:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="view"></div>
</div>
<div class="tabbar" id="tabbar">
  <div data-tab="dash" class="deskonly"><span class="ico">7</span>Dashboard</div>
  <div data-tab="today"><span class="ico">7</span>Today</div>
  <div data-tab="meals"><span class="ico">7</span>Meals</div>
  <div data-tab="plan"><span class="ico">7</span>Plan</div>
  <div data-tab="progress"><span class="ico">7</span>Progress</div>
  <div data-tab="settings"><span class="ico">7</span>Settings</div>
</div>
<div id="timer" class="timer hidden"></div>
<div id="swapmodal"></div>
<script>
"use strict";

/* ============ MEAL TRACKING SECTION ============ */
function mealTotalsForDate(date) {
  const dayMeals = (S.meals || []).filter(m => m.date === date);
  const totals = {
    cal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0
  };
  for (const m of dayMeals) {
    totals.cal += m.cal || 0;
    totals.protein += m.protein || 0;
    totals.carbs += m.carbs || 0;
    totals.fat += m.fat || 0;
    totals.fiber += m.fiber || 0;
  }
  return totals;
}

function saveMealTemplate(name, cal, protein, carbs, fat, fiber) {
  S.savedMeals = S.savedMeals || [];
  S.savedMeals.push({ id: Date.now(), name, cal, protein, carbs, fat, fiber });
  save();
  toast("Saved " + name);
}

function deleteMealTemplate(id) {
  S.savedMeals = (S.savedMeals || []).filter(m => m.id !== id);
  save();
}

function deleteMeal(id) {
  S.meals = (S.meals || []).filter(m => m.id !== id);
  save();
  render();
}

function addMeal(date, name, cal, protein, carbs, fat, fiber) {
  S.meals = S.meals || [];
  S.meals.push({ id: Date.now(), date, name, cal: Number(cal) || 0, protein: Number(protein) || 0, carbs: Number(carbs) || 0, fat: Number(fat) || 0, fiber: Number(fiber) || 0 });
  save();
  render();
  toast("Added " + name);
}

function renderMealsTab() {
  const date = today();
  const dayMeals = (S.meals || []).filter(m => m.date === date).sort((a, b) => (a.date === b.date ? a.id - b.id : 0));
  const totals = mealTotalsForDate(date);
  const targets = S.profile && S.profile.mealTargets ? S.profile.mealTargets : { cal: 2000, protein: 150 };

  const calPct = targets.cal ? Math.min(100, (totals.cal / targets.cal) * 100) : 0;
  const proteinPct = targets.protein ? Math.min(100, (totals.protein / targets.protein) * 100) : 0;

  let html = '<h1>Meals</h1>';
  html += '<div class="card"><h3>Today</h3>';
  html += '<div class="statgrid">';
  html += '<div><div class="dim small">Calories</div><div class="big">' + totals.cal + '</div><div class="dim small">of ' + targets.cal + ' kcal</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + calPct + '%"></div></div></div>';
  html += '<div><div class="dim small">Protein</div><div class="big">' + totals.protein.toFixed(0) + 'g</div><div class="dim small">of ' + targets.protein + 'g</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + proteinPct + '%"></div></div></div></div>';
  html += '<div style="margin-top:12px;font-size:.85rem"><div class="macroRow"><span>Carbs</span><span class="macroVal">' + totals.carbs.toFixed(0) + 'g</span></div>';
  html += '<div class="macroRow"><span>Fat</span><span class="macroVal">' + totals.fat.toFixed(0) + 'g</span></div>';
  html += '<div class="macroRow"><span>Fiber</span><span class="macroVal">' + totals.fiber.toFixed(0) + 'g</span></div></div>';
  html += '<button class="btn full blue-btn" style="margin-top:12px" onclick="openMealModal()">+ Add meal</button>';
  html += '</div>';

  if (dayMeals.length) {
    html += '<h2>Today\'s meals</h2>';
    for (const m of dayMeals) {
      html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><b>' + esc(m.name) + '</b><div class="dim small">' + m.cal + ' kcal · ' + m.protein + 'g P · ' + m.carbs + 'g C · ' + m.fat + 'g F</div></div>';
      html += '<button class="btn danger small-btn" onclick="deleteMeal(' + m.id + ')">X</button></div></div>';
    }
  }

  html += '<h2>Saved meals</h2>';
  const saved = S.savedMeals || [];
  if (saved.length) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
    for (const t of saved) {
      html += '<div class="card" style="padding:10px;cursor:pointer" onclick="quickAddMeal(' + t.id + ')"><b style="font-size:.9rem">' + esc(t.name) + '</b><div class="dim small">' + t.cal + ' cal</div></div>';
    }
    html += '</div>';
  } else {
    html += '<p class="dim small">No saved meals yet. Add one above to save a template.</p>';
  }
  html += '<button class="btn ghost full" style="margin-top:12px" onclick="openSavedMealsModal()">Manage saved meals</button>';

  V.innerHTML = html;
}

function openMealModal() {
  const cal = prompt("Calories:", "");
  if (cal === null) return;
  const protein = prompt("Protein (g):", "");
  if (protein === null) return;
  const carbs = prompt("Carbs (g):", "");
  if (carbs === null) return;
  const fat = prompt("Fat (g):", "");
  if (fat === null) return;
  const fiber = prompt("Fiber (g):", "0");
  if (fiber === null) return;
  const name = prompt("Meal name:", "");
  if (name === null) return;
  if (!name.trim()) return toast("Enter a meal name");

  addMeal(today(), name.trim(), cal, protein, carbs, fat, fiber);

  if (confirm("Save " + name + " as a template for quick reuse?")) {
    saveMealTemplate(name.trim(), Number(cal) || 0, Number(protein) || 0, Number(carbs) || 0, Number(fat) || 0, Number(fiber) || 0);
  }
}

function quickAddMeal(templateId) {
  const t = (S.savedMeals || []).find(m => m.id === templateId);
  if (!t) return;
  addMeal(today(), t.name, t.cal, t.protein, t.carbs, t.fat, t.fiber);
}

function openSavedMealsModal() {
  const saved = S.savedMeals || [];
  let html = '<div class="modal" onclick="if(event.target===this)this.parentNode.innerHTML=\'\'"><div class="inner"><h3>Saved meals</h3>';
  if (!saved.length) {
    html += '<p class="dim small">No saved meals yet.</p>';
  } else {
    for (const t of saved) {
      html += '<div class="card" style="display:flex;justify-content:space-between;align-items:start;padding:10px 12px"><div><b>' + esc(t.name) + '</b><div class="dim small">' + t.cal + ' cal, ' + t.protein + 'g P</div></div><button class="btn danger small-btn" onclick="deleteMealTemplate(' + t.id + ');render()">Delete</button></div>';
    }
  }
  html += '</div></div>';
  document.getElementById("swapmodal").innerHTML = html;
}

/* ============ Exercise database ============ */
const EX = [];
const EXBY = {};

/* ============ State (migrates old Forge data) ============ */
const KEY = "mangelo-v1";
let S = load();
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch(e){}
  try { const f = JSON.parse(localStorage.getItem("forge-v1")); if (f && f.v === 1) { f.profile = null; f.meals = []; f.savedMeals = []; return f; } } catch(e){}
  return { v:1, profile:null, plan:null, logs:[], weights:[], meals:[], savedMeals:[], active:null, theme:"auto" };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function today(){ return new Date().toLocaleDateString("en-CA"); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }

/* ============ Theme ============ */
function applyTheme(){
  const t = S.theme || "auto";
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

/* ============ Views ============ */
const V = document.getElementById("view");
let tab = "today";
function syncTabs(){ document.querySelectorAll("#tabbar [data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab)); }
document.getElementById("tabbar").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (!t) return;
  tab = t.dataset.tab; syncTabs(); render();
});

function render(){
  applyTheme();
  if (!S.profile) { return renderOnboarding(); }
  if (tab === "dash") { return renderDashboard(); }
  if (tab === "today") { return renderToday(); }
  if (tab === "meals") { return renderMealsTab(); }
  if (tab === "plan") { return renderPlan(); }
  if (tab === "progress") { return renderProgress(); }
  if (tab === "settings") { return renderSettings(); }
  V.innerHTML = '<p>Tab: ' + tab + '</p>';
}

function renderOnboarding(){
  V.innerHTML = `<h1><span class="mich">Michel</span><span class="angelo">Angelo</span></h1>
    <p class="quote">Every block of stone has a statue inside it, and it is the task of the sculptor to discover it.</p>
    <div class="card">
      <h3>Welcome to MichelAngelo</h3>
      <p class="dim small">Track your workouts. Log your meals. Shape your future.</p>
    </div>
    <button class="btn full" onclick="setupProfile()">Get Started</button>`;
}

function setupProfile(){
  S.profile = {
    days: 4, goal: "muscle", equip: "gym", heightIn: 70, weightLb: 180,
    mealTargets: { cal: 2000, protein: 150 }
  };
  save();
  render();
}

function renderDashboard(){
  document.body.classList.add("dashmode");
  let html = '<h1><span class="mich">Michel</span><span class="angelo">Angelo</span></h1>';

  const wkLogs = S.logs || [];
  const todayLogs = wkLogs.filter(l => l.date === today());
  const completedSets = todayLogs.reduce((acc, l) => acc + (l.sets || []).filter(s => s.done).length, 0);
  const totalSets = todayLogs.reduce((acc, l) => acc + (l.sets || []).length, 0);

  html += '<div class="card"><h3>Today\'s Workout</h3>';
  html += '<div class="statgrid">';
  html += '<div><div class="dim small">Sets</div><div class="big">' + completedSets + '/' + totalSets + '</div></div>';
  html += '<div><div class="dim small">Exercises</div><div class="big">' + todayLogs.length + '</div></div>';
  html += '</div>';
  html += '<button class="btn small-btn blue-btn" onclick="tab=\'today\';render()">Start workout</button>';
  html += '</div>';

  const mealTotals = mealTotalsForDate(today());
  const mealTargets = S.profile && S.profile.mealTargets ? S.profile.mealTargets : { cal: 2000, protein: 150 };
  const calPct = mealTargets.cal ? Math.min(100, (mealTotals.cal / mealTargets.cal) * 100) : 0;
  const proteinPct = mealTargets.protein ? Math.min(100, (mealTotals.protein / mealTargets.protein) * 100) : 0;

  html += '<div class="card"><h3>Nutrition <span class="dim small">. today</span></h3>';
  html += '<div class="statgrid">';
  html += '<div><div class="dim small">Calories</div><div class="big">' + mealTotals.cal + '</div><div class="dim small">of ' + mealTargets.cal + ' kcal</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + calPct + '%"></div></div></div>';
  html += '<div><div class="dim small">Protein</div><div class="big">' + mealTotals.protein.toFixed(0) + 'g</div><div class="dim small">of ' + mealTargets.protein + 'g</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + proteinPct + '%"></div></div></div>';
  html += '</div>';
  html += '<button class="btn small-btn blue-btn" onclick="tab=\'meals\';render()">Log meal</button>';
  html += '</div>';

  html += '<div class="card"><h3>This Week</h3>';
  html += '<p class="dim small">Track your progress over time</p>';
  html += '<button class="btn small-btn ghost" onclick="tab=\'progress\';render()">View analytics</button>';
  html += '</div>';

  V.innerHTML = html;
}

function renderToday(){
  document.body.classList.remove("dashmode");
  let html = '<h1>Today</h1>';
  const todayLogs = (S.logs || []).filter(l => l.date === today());

  if (!todayLogs.length) {
    html += '<div class="card"><p class="dim">No workout logged yet today.</p>';
    html += '<button class="btn full" onclick="addExercise()">Start First Exercise</button></div>';
  } else {
    for (const log of todayLogs) {
      html += '<div class="card"><div class="exhead"><b>' + esc(log.name) + '</b></div>';
      if (log.sets) {
        for (let i = 0; i < log.sets.length; i++) {
          const s = log.sets[i];
          const done = s.done ? ' done' : '';
          html += '<div class="setrow"><div class="setnum">' + (i+1) + '</div><div>' + s.reps + ' reps</div><div class="x">X</div><div>' + s.wt + ' lb</div>';
          html += '<button class="chk' + done + '" onclick="toggleSet(' + log.id + ',' + i + ')">V</button></div>';
        }
      }
      html += '<button class="btn small-btn ghost" style="margin-top:8px" onclick="removeLog(' + log.id + ')">Delete</button>';
      html += '</div>';
    }
  }

  html += '<h2>Add Exercise</h2>';
  html += '<button class="btn full blue-btn" onclick="addExercise()">+ Log an exercise</button>';

  V.innerHTML = html;
}

function renderPlan(){
  document.body.classList.remove("dashmode");
  let html = '<h1>My Plan</h1>';

  if (!S.plan) {
    html += '<div class="card"><p class="dim">No plan created yet.</p>';
    html += '<button class="btn full blue-btn" onclick="createPlan()">Create Plan</button></div>';
  } else {
    html += '<div class="card"><h2>' + esc(S.plan.name || "Training Plan") + '</h2>';
    html += '<p><span class="gold">' + (S.plan.days || 4) + ' days</span> . <span class="blue">' + (S.plan.goal || "General") + '</span></p>';
    if (S.plan.days_outline) {
      for (const day of S.plan.days_outline) {
        html += '<div style="padding:12px 0;border-top:1px solid var(--border)"><b>' + esc(day.name) + '</b><div class="dim small">' + esc(day.focus || "Mixed") + '</div></div>';
      }
    }
    html += '<button class="btn small-btn ghost" style="margin-top:12px" onclick="editPlan()">Edit Plan</button>';
    html += '</div>';
  }

  V.innerHTML = html;
}

function renderProgress(){
  document.body.classList.remove("dashmode");
  let html = '<h1>Progress</h1>';

  const wkLogs = S.logs || [];
  const weights = S.weights || [];

  if (weights.length) {
    html += '<h2>Weight Trend</h2>';
    html += '<div class="card"><canvas id="progress-chart"></canvas>';
    html += '<table><tr><th>Date</th><th class="num">Weight</th></tr>';
    for (let i = Math.max(0, weights.length - 8); i < weights.length; i++) {
      const w = weights[i];
      html += '<tr><td>' + (w.date || '') + '</td><td class="num">' + w.weight + ' lb</td></tr>';
    }
    html += '</table></div>';
  } else {
    html += '<div class="card"><p class="dim">No weight data logged yet.</p></div>';
  }

  html += '<h2>Activity</h2>';
  const last7 = {};
  const sevenDaysAgo = new Date();
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  for (const log of wkLogs) {
    if (new Date(log.date) >= sevenDaysAgo) {
      last7[log.date] = (last7[log.date] || 0) + 1;
    }
  }

  html += '<div class="card">';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toLocaleDateString("en-CA");
    const count = last7[dateStr] || 0;
    html += '<div class="exline"><span>' + dateStr + '</span><span class="blue">' + count + ' sets</span></div>';
  }
  html += '</div>';

  V.innerHTML = html;
}

function renderSettings(){
  document.body.classList.remove("dashmode");
  let html = '<h1>Settings</h1>';

  html += '<h2>Profile</h2>';
  html += '<div class="card">';
  html += '<label>Height (inches)</label>';
  html += '<input type="number" id="set-height" value="' + (S.profile.heightIn || 70) + '">';
  html += '<label style="margin-top:12px">Weight (lbs)</label>';
  html += '<input type="number" id="set-weight" value="' + (S.profile.weightLb || 180) + '">';
  html += '<label style="margin-top:12px">Goal</label>';
  html += '<select id="set-goal"><option value="strength" ' + (S.profile.goal === "strength" ? "selected" : "") + '>Build Strength</option><option value="muscle" ' + (S.profile.goal === "muscle" ? "selected" : "") + '>Gain Muscle</option><option value="endurance" ' + (S.profile.goal === "endurance" ? "selected" : "") + '>Build Endurance</option><option value="weight-loss" ' + (S.profile.goal === "weight-loss" ? "selected" : "") + '>Lose Weight</option></select>';
  html += '<label style="margin-top:12px">Equipment</label>';
  html += '<select id="set-equip"><option value="gym" ' + (S.profile.equip === "gym" ? "selected" : "") + '>Full Gym</option><option value="home" ' + (S.profile.equip === "home" ? "selected" : "") + '>Home Gym</option><option value="bodyweight" ' + (S.profile.equip === "bodyweight" ? "selected" : "") + '>Bodyweight</option></select>';
  html += '</div>';

  html += '<h2>Meal Targets</h2>';
  html += '<div class="card">';
  html += '<label>Daily Calories</label>';
  html += '<input type="number" id="tgt-cal" value="' + ((S.profile.mealTargets && S.profile.mealTargets.cal) || 2000) + '">';
  html += '<label style="margin-top:12px">Daily Protein (g)</label>';
  html += '<input type="number" id="tgt-protein" value="' + ((S.profile.mealTargets && S.profile.mealTargets.protein) || 150) + '">';
  html += '</div>';

  html += '<h2>App Settings</h2>';
  html += '<div class="card">';
  html += '<label>Theme</label>';
  html += '<select id="set-theme"><option value="auto" ' + (S.theme === "auto" ? "selected" : "") + '>Auto</option><option value="light" ' + (S.theme === "light" ? "selected" : "") + '>Light</option><option value="dark" ' + (S.theme === "dark" ? "selected" : "") + '>Dark</option></select>';
  html += '</div>';

  html += '<button class="btn full" style="margin:20px 0" onclick="saveSettings()">Save Settings</button>';
  html += '<button class="btn ghost full danger" onclick="if(confirm(\'Clear all data?\')){{localStorage.clear();location.reload()}}">Clear All Data</button>';

  V.innerHTML = html;
}

function saveSettings(){
  S.profile.heightIn = Number(document.getElementById("set-height").value) || 70;
  S.profile.weightLb = Number(document.getElementById("set-weight").value) || 180;
  S.profile.goal = document.getElementById("set-goal").value;
  S.profile.equip = document.getElementById("set-equip").value;
  S.profile.mealTargets = {
    cal: Number(document.getElementById("tgt-cal").value) || 2000,
    protein: Number(document.getElementById("tgt-protein").value) || 150
  };
  S.theme = document.getElementById("set-theme").value;
  save();
  toast("Settings saved");
  render();
}

function addExercise(){
  const name = prompt("Exercise name:", "Bench Press");
  if (!name) return;
  const sets = prompt("How many sets?", "3");
  const reps = prompt("Reps per set?", "8");
  const weight = prompt("Weight (lbs)?", "185");

  S.logs = S.logs || [];
  const setArray = [];
  for (let i = 0; i < Number(sets); i++) {
    setArray.push({ reps: Number(reps), wt: Number(weight), done: false });
  }
  S.logs.push({ id: Date.now(), date: today(), name, sets: setArray });
  save();
  render();
  toast("Added " + name);
}

function toggleSet(logId, setIdx){
  for (const log of S.logs) {
    if (log.id === logId && log.sets[setIdx]) {
      log.sets[setIdx].done = !log.sets[setIdx].done;
      save();
      render();
      return;
    }
  }
}

function removeLog(logId){
  S.logs = (S.logs || []).filter(l => l.id !== logId);
  save();
  render();
}

function createPlan(){
  const name = prompt("Plan name:", "My Training Plan");
  if (!name) return;
  S.plan = { name, days: 4, goal: S.profile.goal, days_outline: [
    { name: "Day 1", focus: "Chest & Triceps" },
    { name: "Day 2", focus: "Back & Biceps" },
    { name: "Day 3", focus: "Rest or Cardio" },
    { name: "Day 4", focus: "Legs & Shoulders" }
  ]};
  save();
  render();
  toast("Plan created");
}

function editPlan(){
  const name = prompt("Plan name:", S.plan.name);
  if (!name) return;
  S.plan.name = name;
  save();
  render();
}

render();
</script>
</body>
</html>
