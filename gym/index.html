<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MichelAngelo — Workout Planner & Log</title>
<meta name="description" content="Personal strength training planner and workout log. Every block of stone has a statue inside it.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F0E8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="manifest" href="/gym/manifest.json">
<link rel="apple-touch-icon" href="/gym/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128511;</text></svg>">
<style>
/* Leo palette (matches ndhorizon.com css/style.css): cream ground, deep navy
   for text and primary actions, gold as fill only. Variable names are kept so
   the rest of the app restyles without touching its markup:
   --pink = primary (navy), --blue = secondary accent (steel), --gold = gold text tone. */
:root{
  --bg:#F5F0E8;--bg2:#EDE6D9;--card:#FDFBF7;--border:#DED4C2;
  --text:#2A2620;--dim:#675D4F;
  --pink:#1A2535;--on-pink:#FDFBF7;--blue:#4A6478;--on-blue:#FDFBF7;
  --fill:#C9A84C;--on-fill:#1A2535;
  --green:#2F6E4A;--red:#A63A2E;--gold:#7A5D14;--radius:14px;
  --shadow:0 8px 24px rgba(42,38,32,.07);
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
}
[data-theme=dark]{
  --bg:#141D29;--bg2:#232E3D;--card:#1B2532;--border:#34414F;
  --text:#EDE6D9;--dim:#A6A192;
  --pink:#E4DCCB;--on-pink:#141D29;--blue:#8FB0C7;--on-blue:#141D29;
  --fill:#D8BC68;--on-fill:#141D29;
  --green:#79C69B;--red:#E58C7E;--gold:#D8BC68;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px;min-height:100vh;transition:background .2s}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font-family:var(--serif);font-weight:600;font-size:1.9rem;letter-spacing:-.01em;line-height:1.1;margin-bottom:4px}
h1 .mich{color:var(--pink)}h1 .angelo{color:var(--gold)}
h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:20px 0 10px}
h3{font-size:1rem}
.dim{color:var(--dim)}.small{font-size:.83rem}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.pink{color:var(--pink)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:inline-block;background:var(--pink);color:var(--on-pink);border:none;border-radius:999px;font-family:inherit;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.full{width:100%}
.btn.blue-btn{background:var(--fill);color:var(--on-fill)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.small-btn{padding:7px 14px;font-size:.85rem}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
input,select{background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:1rem;padding:10px 12px;width:100%}
input:focus{outline:none;border-color:var(--pink)}
input[type=number]{text-align:center;font-weight:700;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--dim);margin:12px 0 5px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar div{flex:1;text-align:center;padding:11px 0 9px;font-size:.72rem;color:var(--dim);cursor:pointer;font-weight:600}
.tabbar div.on{color:var(--pink);box-shadow:inset 0 3px 0 var(--fill)}
.tabbar .ico{font-size:1.25rem;display:block;margin-bottom:1px}
.pill{display:inline-block;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:.8rem;font-weight:700;margin:0 6px 6px 0;color:var(--dim);cursor:pointer}
.pill.on{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.setrow{display:grid;grid-template-columns:34px 1fr 16px 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .setnum{color:var(--dim);font-weight:700;font-size:.9rem;text-align:center}
.setrow .x{color:var(--dim);text-align:center}
.chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:transparent;font-size:1.15rem;font-weight:900;cursor:pointer}
.chk.done{background:var(--green);border-color:var(--green);color:var(--card)}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.lastinfo{font-size:.8rem;color:var(--dim);margin-bottom:8px}
.effort{font-size:.8rem;font-weight:700;color:var(--text);background:var(--bg2);border-radius:8px;padding:5px 9px;margin-bottom:8px;display:inline-block}
.suggest{font-size:.83rem;color:var(--gold);font-weight:600;margin-bottom:8px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.statgrid .card{margin:0;text-align:center;padding:12px 8px}
.statgrid .big{font-size:1.45rem;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{color:var(--dim);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 6px}
td{padding:7px 6px;border-top:1px solid var(--border)}
.num{text-align:right}
.hidden{display:none!important}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--pink);color:var(--on-pink);font-weight:700;padding:10px 20px;border-radius:24px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.timer{position:fixed;bottom:64px;left:0;right:0;background:var(--pink);color:var(--on-pink);font-weight:800;text-align:center;padding:9px;z-index:49;font-size:1rem;cursor:pointer;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.swaplist{max-height:340px;overflow-y:auto}
.swaplist .card{padding:10px 12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,14,25,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal>.inner{background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:82vh;overflow-y:auto}
canvas{width:100%;height:150px}
.daycard{cursor:pointer}
.exline{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--border);font-size:.9rem}
.exline:first-of-type{border-top:none}
.qopt{margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.quote{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:1rem;border-left:3px solid var(--fill);padding-left:10px;margin:10px 0}
textarea{background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:1rem;padding:10px 12px;width:100%;font-family:inherit}
.dashgrid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.dashwide{grid-column:1/-1}
.tabbar .deskonly{display:none}
/* ---- Wide-screen dashboard layout (phone is untouched) ---- */
@media(min-width:900px){
  body{padding-bottom:0;padding-left:220px}
  .wrap{max-width:1060px;padding:30px 40px}
  body.dashmode .wrap{max-width:1280px}
  .tabbar{top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-top:none;border-right:1px solid var(--border);padding:22px 12px;align-items:stretch;gap:4px}
  .tabbar .deskonly{display:flex}
  .tabbar div{flex:0 0 auto;text-align:left;padding:12px 15px;font-size:.95rem;display:flex;align-items:center;gap:11px;border-radius:10px}
  .tabbar div.on{background:var(--bg2);color:var(--pink);box-shadow:inset 3px 0 0 var(--fill)}
  .tabbar .ico{display:inline;margin:0;font-size:1.15rem}
  .dashgrid{grid-template-columns:1fr 1fr;gap:20px}
  .timer{left:220px}
  .toast{left:calc(50% + 110px)}
  .modal{align-items:center}
  .modal>.inner{border-radius:18px;max-width:660px}
  h2{margin-top:22px}
  #view .card{padding:18px 20px}
  body:not(.dashmode):not(.workout) #view{column-count:2;column-gap:30px}
  body:not(.dashmode):not(.workout) #view h1,
  body:not(.dashmode):not(.workout) #view h2{column-span:all;margin-top:8px}
  body:not(.dashmode):not(.workout) #view .card,
  body:not(.dashmode):not(.workout) #view .statgrid,
  body:not(.dashmode):not(.workout) #view .quote{break-inside:avoid;margin-bottom:18px}
}
/* ---- Food tab ---- */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;font-size:1rem}
.datenav span{font-size:1.6rem;line-height:1;padding:2px 14px;cursor:pointer;color:var(--pink);user-select:none}
.datenav span.off{opacity:.25;pointer-events:none}
.trainstrip{display:flex;gap:12px;align-items:flex-start}
.trainstrip .ico{font-size:1.4rem;line-height:1.2}
.trainstrip.rest{border-style:dashed}
.phero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pbig b{font-size:2.3rem;font-weight:800;color:var(--pink);line-height:1}
.pbig span{color:var(--dim);font-weight:600;margin-left:4px}
.pleft{font-size:.9rem;text-align:right;padding-bottom:4px}
.pbar,.cbar{height:12px;background:var(--bg2);border-radius:7px;overflow:hidden;margin-top:8px}
.pbar>div{height:100%;background:var(--pink);border-radius:7px;transition:width .3s}
.cbar{height:7px;margin-top:4px}.cbar>div{height:100%;background:var(--blue)}
.qrow{display:grid;grid-template-columns:1fr 62px 92px 22px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.qrow.miss{grid-template-columns:1fr auto 22px}
.qrow .qname{min-width:0}.qrow .qname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow input,.qrow select{padding:7px 6px;font-size:.9rem}
.qx{color:var(--red);cursor:pointer;font-size:1.2rem;text-align:center}
.qtot{display:flex;justify-content:space-between;gap:8px;padding:9px 0 0;border-top:2px solid var(--border);font-size:.88rem;margin-top:2px}
.tapadd{display:inline-block;width:30px;height:30px;line-height:28px;text-align:center;border-radius:50%;background:var(--fill);color:var(--on-fill);font-weight:800;cursor:pointer}
.fchip{font-weight:600;color:var(--text)}
details.card>summary{cursor:pointer;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";float:right;color:var(--dim)}
details.card[open]>summary::after{content:"▴"}
</style>
</head>

<div class="wrap">

</div>
<div class="tabbar" id="tabbar">

  <div data-tab="plan"><span class="ico">📋</span>Plan</div>

</div>
<div id="timer" class="timer hidden"></div>

/* ---------------------------------------------------------------------
   Exercise picker: search + muscle-group filter
   2026-09-04, Lynold's explicit instruction: adding an exercise meant
   scrolling a long flat/grouped list to find it. Two asks: (1) a search
   box that filters by name as you type, (2) a way to filter by target
   muscle (biceps, back, triceps, ...) when you don't know the exact name.

   Muscle tags are DERIVED from each exercise's existing `m` field (and its
   movement pattern `p` as a fallback for exercises whose `m` text doesn't
   say the muscle outright, e.g. "Posterior chain") rather than hand-tagged
   per exercise -- so a newly added exercise is classified automatically
   from the same description already shown on its card, and tags can never
   drift out of sync with what the list already displays.
--------------------------------------------------------------------- */
const MUSCLE_TAGS = ["Back","Chest","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Abs","Traps","Cardio"];
function muscleTagsFor(e){
  const m = e.m || "";
  const has = re => re.test(m);
  const tags = [];
  if (has(/\bback\b/i) || has(/posterior chain/i) || has(/\blats?\b/i) || e.p === "pullH" || e.p === "pullV") tags.push("Back");
  if (has(/chest/i)) tags.push("Chest");
  if (has(/delt/i) || has(/shoulder/i) || e.p === "shoulders") tags.push("Shoulders");
  if (has(/bicep/i)) tags.push("Biceps");
  if (has(/tricep/i)) tags.push("Triceps");
  if (has(/quad/i)) tags.push("Quads");
  if (has(/hamstring/i) || has(/posterior chain/i)) tags.push("Hamstrings");
  if (has(/glute/i) || has(/posterior chain/i) || e.p === "glute") tags.push("Glutes");
  if (has(/calf|calves/i) || e.p === "calves") tags.push("Calves");
  if (has(/\babs?\b/i) || has(/core/i) || has(/obliques?/i) || e.p === "core") tags.push("Abs");
  if (has(/trap/i)) tags.push("Traps");
  if (has(/cardio/i) || e.p === "cardio") tags.push("Cardio");
  return [...new Set(tags)];
}
/*
  Shared by activeAddOpen() (add mid-workout) and planAdd() (add to a plan
  day) -- both used to carry their own near-identical copy of the same
  grouped list with no way to search or filter it. pickerState holds the
  live search text, selected muscle tags, and the pick callback for
  whichever modal is currently open; renderPickerList() re-renders just the
  list portion so typing/tapping a tag never has to rebuild the whole modal
  (and never loses focus on the search input).
*/

function openExercisePicker(list, pickFn, opts){
  opts = opts || {};

  document.getElementById("swapmodal").innerHTML = `<div class="modal" onclick="if(event.target===this)this.parentNode.innerHTML=''">
    <div class="inner">
      <h3 style="margin-bottom:4px">${esc(opts.title || "Add an exercise")}</h3>
      ${opts.subtitle ? `<p class="dim small" style="margin-bottom:8px">${esc(opts.subtitle)}</p>` : ""}
      ${opts.extraHTML || ""}
      <input id="pk-search" placeholder="Search exercises by name..." style="margin-bottom:10px" oninput="pickerSetSearch(this.value)">
      <div style="margin-bottom:6px">${MUSCLE_TAGS.map(t => `<span class="pill" id="pk-tag-${t}" onclick="pickerToggleTag('${t}')">${t}</span>`).join("")}</div>

function pickerSetSearch(v){ pickerState.search = v.trim().toLowerCase(); renderPickerList(true); }
function pickerToggleTag(tag){
  const i = pickerState.tags.indexOf(tag);
  if (i >= 0) pickerState.tags.splice(i, 1); else pickerState.tags.push(tag);
  const el = document.getElementById("pk-tag-" + tag); if (el) el.classList.toggle("on");

function renderPickerList(keepFocus){
  const { all, search, tags } = pickerState;
  let list = all;
  if (search) list = list.filter(e => e.n.toLowerCase().includes(search));
  // OR across selected tags: picking "Back" and "Biceps" shows exercises
  // for either, not only exercises that hit both.
  if (tags.length) list = list.filter(e => { const et = muscleTagsFor(e); return tags.some(t => et.includes(t)); });
  const filtered = Boolean(search || tags.length);
  const groups = filtered ? [[null, list]] : [
    ["Cardio", list.filter(e => e.p === "cardio")],
    ["My custom", list.filter(e => e.p === "custom")],
    ["Legs & glutes", list.filter(e => ["squat","hinge","glute","lunge","calves"].includes(e.p))],
    ["Push (chest/shoulders/tris)", list.filter(e => ["pushH","pushV","shoulders"].includes(e.p) || (e.p === "arms" && /Tri/i.test(e.m)))],
    ["Pull (back/biceps)", list.filter(e => ["pullH","pullV"].includes(e.p) || (e.p === "arms" && /Bicep/i.test(e.m)))],
    ["Core", list.filter(e => e.p === "core")]
  ];
  document.getElementById("pk-list").innerHTML = groups.map(([label, items]) => items.length
    ? (label ? `<div class="dim small" style="margin:8px 0 4px;font-weight:700">${label}</div>` : "")

    : "").join("") || '<p class="dim small">No exercises match — try a different name or muscle.</p>';

/* Barbell exercises get a plate calculator (45 lb bar) */
const BARBELL = new Set(["bb-squat","bb-deadlift","rdl","sumo-dl","hip-thrust","kas-bridge","bb-bench","ohp","bb-row","bb-curl","skullcrusher","front-squat","incline-bb-bench","decline-bench","close-grip-bench","pendlay-row","good-morning","bb-shrug"]);
function platesFor(w) {
  w = Number(w);
  if (!isFinite(w) || w < 45) return null;
  if (w === 45) return "just the 45 lb bar";
  let side = (w - 45) / 2;
  const parts = [];
  for (const p of [45, 35, 25, 10, 5, 2.5]) { let c = 0; while (side >= p - 0.01) { c++; side -= p; } if (c) parts.push(c + "×" + p); }
  if (!parts.length) return null;
  return parts.join(" + ") + " per side + 45 lb bar" + (side > 0.01 ? " (+" + side.toFixed(1) + " more/side)" : "");
}

// Duplicate detection by normalized name
function normName(n){ return String(n).toLowerCase().replace(/[^a-z0-9]/g, "").replace(/s$/, ""); }
function detectDuplicates(){
  const ids = new Set();
  for (const l of S.logs) for (const en of l.entries) ids.add(en.ex);
  if (S.plan) for (const d of S.plan.days) for (const s of d.exercises) ids.add(s.ex);
  const groups = {};
  ids.forEach(id => { const ex = EXBY[id]; const key = normName(ex ? ex.n : id); (groups[key] = groups[key] || []).push(id); });
  return Object.values(groups).filter(g => g.length > 1);
}
function mergeExercise(fromId, toId){
  if (fromId === toId) return;

  if (S.plan) for (const d of S.plan.days) for (const s of d.exercises) if (s.ex === fromId) s.ex = toId;
  if (S.active) for (const en of S.active.entries) if (en.ex === fromId) en.ex = toId;
  S.customEx = (S.customEx || []).filter(c => c.id !== fromId);

}
function mergeGroup(str){
  const ids = str.split(",");
  const count = id => S.logs.reduce((a, l) => a + (l.entries.some(e => e.ex === id) ? 1 : 0), 0);
  const keep = ids.slice().sort((a, b) => count(b) - count(a))[0];
  const others = ids.filter(i => i !== keep);
  if (!confirm("Merge " + others.map(i => EXBY[i] ? EXBY[i].n : i).join(", ") + " into “" + (EXBY[keep] ? EXBY[keep].n : keep) + "”? Their history combines into one lift.")) return;

}

// Auto-balance plan volume toward 10–22 sets/muscle by adjusting set counts
function rebalancePlan(){
  if (!S.plan) return;
  const cap = S.profile.goal === "strength" ? 4 : 5, floor = 2;
  const findSlot = (m, needMore) => { let t = null; for (const d of S.plan.days) for (const s of d.exercises) { const ex = EXBY[s.ex]; if (!ex || ex.u === "time") continue; const prim = musclesFor(s.ex)[0]; if (prim && prim[0] === m) { if (needMore && s.sets < cap) return s; if (!needMore && s.sets > floor) t = s; } } return t; };
  MUSCLE_ORDER.forEach(m => { let g = 0; while ((plannedSetsByMuscle()[m] || 0) < 10 && g++ < 8) { const s = findSlot(m, true); if (!s) break; s.sets++; } });
  MUSCLE_ORDER.forEach(m => { let g = 0; while ((plannedSetsByMuscle()[m] || 0) > 22 && g++ < 8) { const s = findSlot(m, false); if (!s) break; s.sets--; } });
  save(); render(); toast("Plan volume rebalanced");

// Plain-English coaching insights, prioritized (warn → good → info)
function insights(){

  const wk = S.logs.filter(l => (Date.now() - new Date(l.date + "T12:00")) / 864e5 < 7).length, tgt = S.profile.days;
  if (tgt && wk >= tgt) add("good", "On track: " + wk + " workout" + (wk === 1 ? "" : "s") + " logged this week. Consistency is the #1 driver of results.");
  const planned = plannedSetsByMuscle();
  const low = MUSCLE_ORDER.filter(m => (planned[m] || 0) > 0 && (planned[m] || 0) < 10);
  const high = MUSCLE_ORDER.filter(m => (planned[m] || 0) > 22);
  if (low.length) add("warn", "Undertrained: " + low.join(", ") + " get under 10 planned sets/week. Add a set or exercise — or tap “Auto-balance volume” in Plan.");
  if (high.length) add("info", "High volume: " + high.join(", ") + " exceed ~22 sets/week, likely more than you can recover from.");
  const pressV = (planned.Chest || 0) + (planned.Triceps || 0), pullV = (planned.Back || 0) + (planned.Biceps || 0);
  if (pressV > 0 && pullV > 0) { const r = pressV / pullV;
    if (r > 1.5) add("warn", "Push/pull imbalance: your pushing sets (chest + triceps) are " + r.toFixed(1) + "× your pulling sets (back + biceps). Add more pulling volume — extra back/biceps sets — so they roughly match. Even push/pull keeps shoulders healthy and posture upright.");
    else if (r < 0.67) add("warn", "Push/pull imbalance: your pulling sets (back + biceps) are " + (1 / r).toFixed(1) + "× your pushing sets (chest + triceps). Add more pushing volume — extra chest/triceps sets — to balance them out."); }
  const planIds = S.plan ? [...new Set(S.plan.days.flatMap(d => d.exercises.map(e => e.ex)))] : [];
  const stalledIds = planIds.filter(id => EXBY[id] && EXBY[id].inc > 0 && stalled(id));
  if (stalledIds.length >= 3) add("warn", stalledIds.length + " lifts have stalled 3+ sessions (" + stalledIds.slice(0, 3).map(id => EXBY[id].n).join(", ") + (stalledIds.length > 3 ? "…" : "") + "). Take an easier week — drop those weights ~15%, then build back up. Backing off is how you push past a stall.");
  else if (stalledIds.length) add("info", "Stalled: " + stalledIds.map(id => EXBY[id].n).join(", ") + " — each shows a lighter target next session to help you break through.");

  const ar = avgRpe(14);
  if (ar !== null) { if (ar < 7) add("warn", "Your sets average RPE " + ar.toFixed(1) + " — you're leaving reps in the tank. Push closer to failure (RPE 8–9) to grow."); else if (ar > 9.3) add("info", "Average RPE " + ar.toFixed(1) + " — training very hard. Watch recovery; a deload may be due."); }
  if (S.profile.goal === "recomp") { const tr = bwTrend(); if (tr) { if (tr.pct <= -0.5 && tr.pct >= -1.5) add("good", "Fat loss on track (" + tr.perWeek.toFixed(1) + " lb/wk). Keep protein high and lifts heavy."); else if (tr.perWeek > -0.05) add("warn", "Weight isn't dropping — fat loss needs a calorie deficit. Tighten intake ~250 kcal/day."); else if (tr.pct < -1.5) add("info", "Losing fast (" + tr.perWeek.toFixed(1) + " lb/wk) — protect muscle: keep protein up, don't crash-diet."); } }
  const days = {};
  (S.nutrition || []).forEach(x => { const D = days[x.date] = days[x.date] || { p: 0 }; D.p += x.p || 0; });
  const loggedDays = Object.keys(days).filter(k => (Date.now() - new Date(k + "T12:00")) / 864e5 < 7);
  if (loggedDays.length) {

    else add("good", "Protein dialed in: ~" + Math.round(avgP) + "g/day. That's what holds muscle while you lean out.");
  }
  const shouldTrain = ["Chest", "Back", "Shoulders", "Quads", "Hamstrings", "Glutes", "Core"];
  const missing = shouldTrain.filter(m => !(planned[m] > 0));
  if (missing.length) add("warn", "Not in your plan: " + missing.join(", ") + ". Add an exercise for each (Plan → add exercise) or hit Regenerate so nothing gets neglected.");
  const dups = detectDuplicates();
  if (dups.length) add("info", "Duplicate exercises found (" + dups.slice(0, 2).map(g => g.map(id => EXBY[id] ? EXBY[id].n : id).join("/")).join("; ") + "). Merge them in Settings so progress isn't split.");

}

function drawAdherence(id, adh){

function groupOf(a, i){
  // indices of the superset group containing entry i (or just [i])
  const ss = a.entries[i] && a.entries[i].ss;
  if (!ss) return [i];
  return a.entries.map((e, j) => e.ss === ss ? j : -1).filter(j => j >= 0);
}
function entryDone(en){ return en.sets.every(st => st.done); }
function nextIncomplete(a){
  for (let i = 0; i < a.entries.length; i++) if (!entryDone(a.entries[i])) return i;
  return -1;
}

function jumpToExercise(i){
  S.active.cur = i; save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function setVal(ei, si, k, v){ S.active.entries[ei].sets[si][k] = v === "" ? "" : Number(v); save(); }
function setRpe(ei, val){ const en = S.active.entries[ei]; en.rpe = en.rpe === val ? null : val; save(); render(); }
function toggleSet(ei, si){
  const a = S.active;
  const en = a.entries[ei];
  const st = en.sets[si];
  const isTime = EXBY[en.ex] && EXBY[en.ex].u === "time";
  st.done = !st.done;
  if (st.done && st.r === "") st.r = isTime ? en.lo : en.hi;

  let advanced = false;
  if (st.done) {
    const group = groupOf(a, a.cur);
    const groupDone = group.every(gi => entryDone(a.entries[gi]));
    if (groupDone) {
      const n = nextIncomplete(a);
      if (n >= 0) { a.cur = n; advanced = true; }
    }
  }
  save(); render();
  if (advanced) { toast("Next: " + EXBY[a.entries[a.cur].ex].n); window.scrollTo({ top: 0, behavior: "smooth" }); stopRest(); return; }
  if (st.done && !isTime) {
    // superset: no rest between the pair — rest only after the LAST exercise of the group's set
    const group = groupOf(a, ei);
    if (group.length > 1 && ei !== group[group.length - 1]) return;
    startRest(group.length > 1 ? 90 : (en.rest || 120));
  }
}
function addSet(ei){ const s = S.active.entries[ei].sets; s.push({ w: s[s.length-1] ? s[s.length-1].w : "", r: "", done: false }); save(); render(); }
function dropSet(ei){ const s = S.active.entries[ei].sets; if (s.length > 1) s.pop(); save(); render(); }

    <div class="inner"><h3 style="margin-bottom:10px">Swap ${esc(cur.n)} for:</h3>

}
function doSwap(ei, id){

function finishWorkout(){

  const trained = new Set(S.logs[S.logs.length - 1].entries.map(e => e.ex));
  const tune = autoProgress(a.dayIdx, trained);
  if (tune.length) S.tune = { date: today(), msgs: tune };
  if (a.dayIdx === S.plan.nextDay % S.plan.days.length) S.plan.nextDay++;

  toast(tune.length ? "Logged 🗿 · plan auto-tuned" : "Logged 🗿"); render();

function activeAdd(id){
  const a = S.active; if (!a) return;

  const ex = EXBY[id];
  const g = GOALS[S.profile.goal] || GOALS.general;

  const setsN = isTime ? 1 : g.accessory[0], rest = isTime ? 0 : REST.accessory;
  const sug = suggestFor(id, lo, hi);

function activeRemoveEx(ei){
  const a = S.active; if (!a) return;
  if (a.entries.length <= 1) return toast("Keep at least one exercise");
  const ex = EXBY[a.entries[ei].ex];
  if (!confirm("Remove " + (ex ? ex.n : "this exercise") + " from today's workout?")) return;
  a.entries.splice(ei, 1);
  if (a.cur >= a.entries.length) a.cur = a.entries.length - 1;
  const n = nextIncomplete(a); if (n >= 0) a.cur = n;
  save(); render();
}

/* ---- Rest timer ---- */
let restIv = null, restEnd = 0;
function startRest(sec){
  restEnd = Date.now() + (sec || 120) * 1000;
  const el = document.getElementById("timer");
  el.classList.remove("hidden");
  el.onclick = stopRest;
  clearInterval(restIv);
  restIv = setInterval(() => {
    const left = Math.round((restEnd - Date.now()) / 1000);
    if (left <= 0) { stopRest(); return; }
    el.textContent = "Rest " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") + " — tap to skip";
  }, 250);
}
function stopRest(){ clearInterval(restIv); const el = document.getElementById("timer"); if (el) el.classList.add("hidden"); }
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}

function drawBwTrend(id){
  const c = document.getElementById(id); if (!c) return;
  const ws = S.weights.slice().sort((a,b) => a.date.localeCompare(b.date));
  const vals = ws.map(w => w.lbs);
  if (vals.length < 2) { if (vals.length === 1) { const x = c.getContext("2d"); x.clearRect(0,0,c.width,c.height); x.fillStyle = chartColors().label; x.font = "12px sans-serif"; x.fillText(vals[0] + " lb — log again for a trend", 14, 24); } return; }
  const col = chartColors(), x = c.getContext("2d"), W = c.width, H = c.height;
  const min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;
  const px = i => 14 + (i / (vals.length - 1)) * (W - 28);
  const py = v => 14 + (1 - (v - min) / rng) * (H - 40);
  x.clearRect(0, 0, W, H);
  x.strokeStyle = col.label; x.globalAlpha = 0.35; x.lineWidth = 1.5; x.beginPath();
  vals.forEach((v, i) => i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))); x.stroke();
  x.fillStyle = col.label; vals.forEach((v, i) => { x.beginPath(); x.arc(px(i), py(v), 2.2, 0, 7); x.fill(); });
  x.globalAlpha = 1;
  const t0 = new Date(ws[0].date + "T12:00").getTime();
  const X = ws.map(w => (new Date(w.date + "T12:00").getTime() - t0) / 864e5);
  const n = X.length; let sx=0, sy=0, sxx=0, sxy=0;
  for (let i = 0; i < n; i++) { sx+=X[i]; sy+=vals[i]; sxx+=X[i]*X[i]; sxy+=X[i]*vals[i]; }
  const slope = (n*sxy - sx*sy) / ((n*sxx - sx*sx) || 1), b = (sy - slope*sx) / n;
  x.strokeStyle = col.line; x.lineWidth = 2.5; x.beginPath();
  X.forEach((xx, i) => { const v = slope*xx + b; i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v)); }); x.stroke();
  x.fillStyle = col.label; x.font = "11px sans-serif"; x.textAlign = "left";
  x.fillText(max + " lb", 14, 12); x.fillText(min + " lb", 14, H - 6);
}
// Every logged session of one exercise, chronological
function exerciseHistory(exId){
  const out = [];
  for (const l of S.logs) {
    const en = l.entries.find(x => x.ex === exId && x.sets.length);
    if (!en) continue;
    const sets = en.sets;
    out.push({
      date: l.date,
      sets,
      e1rm: Math.max(...sets.map(s => e1rm(s.w, s.r))),
      vol: sets.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0),
      topMin: Math.max(...sets.map(s => s.r || 0))
    });
  }
  return out;
}

function weeklyVolume(logs){
  const byWeek = {};
  for (const l of logs) {
    const d = new Date(l.date + "T12:00");
    const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const k = monday.toLocaleDateString("en-CA");

function drawBars(id, vals, labels){
  const c = document.getElementById(id); if (!c || !vals.length) return;
  const col = chartColors();
  const x = c.getContext("2d"), W = c.width, H = c.height, max = Math.max(...vals) || 1;
  x.clearRect(0, 0, W, H);
  const bw = Math.min(56, (W - 20) / vals.length - 8);
  vals.forEach((v, i) => {
    const h = Math.max(3, (v / max) * (H - 38));
    const px = 10 + i * ((W - 20) / vals.length) + ((W - 20) / vals.length - bw) / 2;
    x.fillStyle = col.bar; x.beginPath(); x.roundRect(px, H - 22 - h, bw, h, 4); x.fill();
    x.fillStyle = col.label; x.font = "10px sans-serif"; x.textAlign = "center";

function drawLine(id, vals){

  x.clearRect(0, 0, W, H); x.strokeStyle = col.line; x.lineWidth = 2.5; x.beginPath();
  vals.forEach((v, i) => {
    const px = 14 + (i / (vals.length - 1)) * (W - 28);
    const py = 14 + (1 - (v - min) / rng) * (H - 40);
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  });

  x.fillStyle = col.label; x.font = "11px sans-serif"; x.textAlign = "left";

// Parse an Apple Health export.xml and pull body-weight (BodyMass) records in
function importHealthWeights(inp){
  const f = inp.files[0]; if (!f) return;
  toast("Reading export…");
  const r = new FileReader();
  r.onload = () => {
    try {
      const text = String(r.result);
      const re = /<Record\b([^>]*?)\/?>/g;
      const attr = (s, k) => { const mm = s.match(new RegExp(k + '="([^"]*)"')); return mm ? mm[1] : null; };
      const byDate = {};
      let m;
      while ((m = re.exec(text))) {
        const a = m[1];
        if (a.indexOf("HKQuantityTypeIdentifierBodyMass") === -1) continue;
        const sd = attr(a, "startDate"), val = attr(a, "value"), unit = attr(a, "unit");
        if (!sd || !val) continue;
        let lbs = Number(val);
        if (!isFinite(lbs)) continue;
        if (unit && /kg/i.test(unit)) lbs = lbs * 2.2046226;
        lbs = Math.round(lbs * 10) / 10;
        if (lbs < 50 || lbs > 700) continue;
        byDate[sd.slice(0, 10)] = lbs; // records are chronological, last of a day wins
      }
      const have = new Set(S.weights.map(w => w.date));
      let added = 0;
      for (const date in byDate) { if (!have.has(date)) { S.weights.push({ date, lbs: byDate[date] }); added++; } }
      S.weights.sort((a, b) => a.date.localeCompare(b.date));
      if (S.profile && S.weights.length) S.profile.weightLb = S.weights[S.weights.length - 1].lbs;
      save(); render();
      toast(added ? "Imported " + added + " weigh-ins" : "No new weigh-ins found");
    } catch (e) { toast("Couldn't read that file"); }
  };
  r.readAsText(f);
}

  let cal = 2000;
  if (p.weightLb && p.heightIn && p.age) {

function usdaToFood(f){
  const get = no => { const x = (f.foodNutrients || []).find(n => String(n.nutrientNumber) === no); return x ? +x.value || 0 : 0; };
  let cal = get("208"); if (!cal) cal = get("957") || get("958");

let scanStream = null, scanTimer = null, zxReader = null, zxLoad = null, scanBusy = false;
function loadZXing(){
  if (window.ZXing) return Promise.resolve();
  if (!zxLoad) zxLoad = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"; s.onload = res; s.onerror = () => { zxLoad = null; rej(new Error("load")); }; document.head.appendChild(s); });
  return zxLoad;
}
function stopScanner(){

async function openScanner(){
  scanBusy = false;

    <video id="scanv" playsinline muted autoplay style="width:100%;max-height:46vh;border-radius:12px;background:#000;object-fit:cover"></video>

async function lookupBarcode(code){

function trainVsRest(nDays){

/* ---- Nutrition label photo ----
   Reads a photo of a Nutrition Facts label on the device (Tesseract.js,
   loaded only the first time you use it), pulls out calories, protein,
   carbs and fat per serving, and lets you check the numbers before logging. */
let tessWorker = null, tessLoad = null, labelData = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoad) tessLoad = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = res; s.onerror = () => { tessLoad = null; rej(new Error("load")); }; document.head.appendChild(s); });
  return tessLoad;
}
function pickLabelPhoto(){ const i = document.getElementById("labelpick"); if (i) { i.value = ""; i.click(); } }
function prepImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1800 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, cv.width, cv.height);
      const d = cx.getImageData(0, 0, cv.width, cv.height), a = d.data;
      for (let i = 0; i < a.length; i += 4) { let g = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]; g = Math.max(0, Math.min(255, (g - 128) * 1.6 + 128)); a[i] = a[i + 1] = a[i + 2] = g; }
      cx.putImageData(d, 0, 0); URL.revokeObjectURL(url); res({ canvas: cv, url: cv.toDataURL("image/jpeg", 0.6) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}
function parseLabel(txt){
  const lines = String(txt).replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
  const NUM = "(\\d+(?:[.,]\\d+)?|[oO](?=\\s*m?g\\b))";
  const val = s => { const v = parseFloat(String(s).replace(/[oO]/g, "0").replace(",", ".")); return isFinite(v) ? v : null; };
  const grab = (re, skip) => { for (const ln of lines) { if (skip && skip.test(ln)) continue; const m = ln.match(re); if (m) { const v = val(m[1]); if (v != null) return v; } } return null; };
  let cal = grab(new RegExp("calories(?!\\s*from)[^\\d\\n]{0,14}?" + NUM, "i"));
  if (cal == null) cal = grab(/(\d{2,4})\s*kcal/i);
  const p = grab(new RegExp("prote[il1]n[^\\d\\n]{0,10}?" + NUM, "i"));
  const c = grab(new RegExp("carb[a-z.]*[^\\d\\n]{0,10}?" + NUM, "i"));
  let f = grab(new RegExp("total\\s*fat[^\\d\\n]{0,10}?" + NUM, "i"));
  if (f == null) f = grab(new RegExp("\\bfat[^\\d\\n]{0,10}?" + NUM, "i"), /satur|trans|calories/i);
  let serving = "";
  for (const ln of lines) { const m = ln.match(/serving\s*size\s*:?\s*(.+)/i); if (m) { serving = m[1].slice(0, 40); break; } }
  return { cal, p, c, f, serving };
}
async function readLabel(inp){
  const file = inp.files && inp.files[0]; if (!file) return;
  fmodal(`<h3 style="margin-bottom:8px">Reading the label…</h3><p id="lbl-msg" class="dim small">Getting ready (first time downloads the reader, ~5 MB)</p><div class="pbar" style="margin-top:8px"><div id="lbl-bar" style="width:3%"></div></div>`);
  const msg = t => { const el = document.getElementById("lbl-msg"); if (el) el.textContent = t; };
  const bar = p => { const el = document.getElementById("lbl-bar"); if (el) el.style.width = Math.round(p * 100) + "%"; };
  try {
    const [{ canvas, url }] = await Promise.all([prepImage(file), loadTesseract()]);
    if (!tessWorker) tessWorker = await Tesseract.createWorker("eng", 1, { logger: m => { if (m.status === "recognizing text") { msg("Reading numbers…"); bar(0.2 + 0.8 * m.progress); } else if (/load|initializ/.test(m.status)) { msg("Loading the reader…"); bar(0.1 + 0.1 * (m.progress || 0)); } } });
    const { data } = await tessWorker.recognize(canvas);
    const r = parseLabel(data.text || "");
    labelData = { ...r, img: url, text: data.text || "" };
    showLabelForm();
  } catch (e) {
    fmodal(`<h3>Couldn't read that photo</h3><p class="dim small" style="margin:8px 0">${navigator.onLine ? "Try a sharper, straight-on photo of just the Nutrition Facts panel, in good light." : "The label reader needs a connection the first time it loads."} You can also type the numbers under “Enter numbers yourself”.</p><button class="btn full" onclick="closeFoodModal()">OK</button>`);
  }
}

/* ---- Sync across devices (private GitHub Gist) ----
   One account: your GitHub token (gist permission only) is pasted once on
   each device. Your data is stored in a private gist as michelangelo.json.
   Each save marks S.updatedAt; sync compares that with what was last synced:
   only this device changed -> push; only the cloud changed -> take it;
   both changed -> combine (same merge as restoring a backup), then push.
   The token lives in its own storage key, never inside backups. */
const SYNC_KEY = "mangelo-sync", SYNC_FILE = "michelangelo.json";
let syncCfg = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch (e) { return null; } })();
let syncBusy = false, syncAgain = false, syncPushTimer = null, syncErr = "";
function saveSyncCfg(){ try { if (syncCfg) localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); else localStorage.removeItem(SYNC_KEY); } catch (e) {} }
function gh(path, opts){
  opts = opts || {};
  return fetch("https://api.github.com" + path, { method: opts.method || "GET", cache: "no-store", headers: { Authorization: "Bearer " + (opts.token || syncCfg.token), Accept: "application/vnd.github+json", ...(opts.body ? { "Content-Type": "application/json" } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(async r => { if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; } return r.status === 204 ? null : r.json(); });
}
async function readGist(g){
  const f = g.files && g.files[SYNC_FILE]; if (!f) return null;
  let txt = f.content;
  if (f.truncated && f.raw_url) txt = await fetch(f.raw_url, { cache: "no-store" }).then(r => r.text());
  try { const d = JSON.parse(txt); return d && d.v === 1 ? d : null; } catch (e) { return null; }
}
function scheduleSync(){ if (!syncCfg) return; clearTimeout(syncPushTimer); syncPushTimer = setTimeout(syncNow, 1500); }
function hasData(d){ return !!(d && ((d.logs && d.logs.length) || (d.nutrition && d.nutrition.length) || (d.weights && d.weights.length) || d.profile)); }
function adoptRemote(remote){
  const keepActive = S.active && !remote.active ? S.active : null;
  S = remote; if (keepActive) S.active = keepActive;
  localStorage.setItem(KEY, JSON.stringify(S)); hydrateCustom();
}
function safeRender(){ const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && document.getElementById("view").contains(a)) return; render(); }
async function syncNow(manual){
  if (!syncCfg || !syncCfg.gist) return;
  if (!navigator.onLine) { syncErr = "offline"; if (manual) toast("Offline — will sync when you're back online"); return; }
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  try {
    const g = await gh("/gists/" + syncCfg.gist), remote = await readGist(g);
    const last = syncCfg.last || 0, localAt = S.updatedAt || 0, remoteAt = remote ? remote.updatedAt || 0 : 0;
    const localChanged = localAt > last, remoteChanged = remote && remoteAt > last;
    let pulled = false;
    if (remote && (!hasData(S) || !localAt)) { adoptRemote(remote); pulled = true; }
    else if (remoteChanged && !localChanged) { adoptRemote(remote); pulled = true; }
    else if (remoteChanged && localChanged) { mergeBackup(remote); if (remoteAt > localAt && remote.plan) S.plan = remote.plan; S.updatedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); hydrateCustom(); pulled = true; }
    if (pulled) { syncCfg.last = remoteAt; }
    const hkFiles = hkTakeFiles(g);
    if (hkFiles.length) { S.updatedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); pulled = "health"; }
    if ((S.updatedAt || 0) > (syncCfg.last || 0) || !remote) {
      const at = S.updatedAt || Date.now(); if (!S.updatedAt) S.updatedAt = at;
      const files = { [SYNC_FILE]: { content: JSON.stringify(S) } }; hkFiles.forEach(n => { files[n] = null; });
      await gh("/gists/" + syncCfg.gist, { method: "PATCH", body: { files } });
      syncCfg.last = at;
    }
    syncCfg.at = Date.now(); syncErr = ""; saveSyncCfg();
    if (pulled) { safeRender(); if (manual !== "connect") toast(pulled === "health" ? "Apple Health data updated" : "Synced from your other device"); }
    else if (manual === true) { toast("Synced ✓"); if (tab === "settings") render(); }
  } catch (e) {
    syncErr = e.status === 401 ? "token" : e.status === 404 ? "gone" : "net";
    if (manual) toast(syncErr === "token" ? "GitHub token rejected — reconnect in Settings" : syncErr === "gone" ? "Sync gist not found — reconnect in Settings" : "Couldn't reach GitHub — will retry");
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; setTimeout(syncNow, 300); }
  }
}
async function connectSync(){
  const inp = document.getElementById("sync-token"), token = (inp && inp.value || "").trim();
  if (!token) return toast("Paste your GitHub token first");
  const btn = document.getElementById("sync-go"); if (btn) { btn.disabled = true; btn.textContent = "Connecting…"; }
  try {
    const user = await gh("/user", { token });
    let gist = null;
    for (let page = 1; page <= 5 && !gist; page++) {
      const list = await gh("/gists?per_page=100&page=" + page, { token });
      gist = list.find(g => g.files && g.files[SYNC_FILE]);
      if (list.length < 100) break;
    }
    syncCfg = { token, login: user.login, gist: gist ? gist.id : null, last: 0 };
    if (gist) {
      const remote = await readGist(await gh("/gists/" + gist.id, { token }));
      if (remote) {
        if (!hasData(S)) adoptRemote(remote);
        else { mergeBackup(remote); if ((remote.updatedAt || 0) > (S.updatedAt || 0) && remote.plan) S.plan = remote.plan; hydrateCustom(); }
        S.updatedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S));
      }
    } else {
      if (!S.updatedAt) S.updatedAt = Date.now();
      const g = await gh("/gists", { method: "POST", token, body: { description: "MichelAngelo gym data (sync)", public: false, files: { [SYNC_FILE]: { content: JSON.stringify(S) } } } });
      syncCfg.gist = g.id; syncCfg.last = S.updatedAt;
    }
    saveSyncCfg();
    await syncNow("connect");
    fmodal(""); render(); toast(gist ? "Connected — your data is synced" : "Connected — this device is now your cloud copy");
  } catch (e) {
    syncCfg = null; saveSyncCfg();
    if (btn) { btn.disabled = false; btn.textContent = "Connect"; }
    toast(e.status === 401 ? "GitHub didn't accept that token" : e.status === 403 || e.status === 404 ? "Token needs the “gist” permission" : "Couldn't reach GitHub — check your connection");
  }
}
function disconnectSync(){
  if (!confirm("Stop syncing on this device?\n\nYour data stays here and in your cloud copy. Other devices keep syncing.")) return;
  syncCfg = null; saveSyncCfg(); render(); toast("Sync off on this device");
}
function copySyncToken(){
  if (!syncCfg) return;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(syncCfg.token).then(() => toast("Token copied — paste it on your other device")).catch(() => toast("Couldn't copy"));
}
function agoText(t){ if (!t) return "never"; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : new Date(t).toLocaleDateString(); }
function syncSetupHTML(){

    <ol class="dim small" style="margin:0 0 10px 18px;line-height:1.7">

function syncCardHTML(){

  const warn = syncErr === "token" ? "GitHub rejected the token (expired or deleted). Disconnect and connect with a new one." : syncErr === "gone" ? "The sync gist was deleted. Disconnect and connect again to make a new one." : syncErr === "net" ? "Couldn't reach GitHub last try — changes are kept here and will sync when it's back." : syncErr === "offline" ? "Offline — changes will sync when you're back online." : "";

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn small-btn" onclick="syncNow(true)">Sync now</button><button class="btn ghost small-btn" onclick="copySyncToken()">Copy token for another device</button><button class="btn ghost small-btn" onclick="disconnectSync()">Disconnect</button></div>

/* ---- Apple Health daily import ----
   An iPhone Shortcut runs each night, reads the day that just ended from
   Health, and drops it into the sync gist as health-YYYY-MM-DD.json. On the
   next sync the app folds those files into S.hk (keyed by date) and deletes
   them from the gist. Values arrive as text from Shortcuts, so parsing is
   forgiving ("8,432", "7 hr 12 min", "62 count/min"). Empty values never
   overwrite good ones — a run while the phone is locked sends blanks. */
const HK_FIELDS = ["steps", "ex", "kcal", "stand", "rhr", "hrv", "vo2", "sleep", "deep", "rem"];
function hkNum(v){ if (v == null) return null; const m = String(v).replace(/,/g, "").match(/-?\d+(\.\d+)?/); return m ? +m[0] : null; }
function hkDur(v){
  // Returns minutes. Accepts "7:12:00", "7 hr 12 min", "7h 12m", "432 min", "25920" (seconds), "7.2" (hours)
  if (v == null) return null; const s = String(v).toLowerCase().replace(/,/g, "").trim(); if (!s) return null;
  let m = s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/); if (m) return +m[1] * 60 + +m[2] + (m[3] ? +m[3] / 60 : 0);
  const h = s.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/), mi = s.match(/(\d+(?:\.\d+)?)\s*(?:m|min|mins|minute|minutes)\b/), se = s.match(/(\d+(?:\.\d+)?)\s*(?:s|sec|secs|second|seconds)\b/);
  if (h || mi || se) return (h ? +h[1] * 60 : 0) + (mi ? +mi[1] : 0) + (se ? +se[1] / 60 : 0);
  const n = hkNum(s); if (n == null) return null;
  return n > 1440 ? n / 60 : n > 24 ? n : n * 60;
}
function hkClean(raw){
  const o = {};
  const put = (k, v) => { if (v != null && isFinite(v) && v > 0) o[k] = Math.round(v * 10) / 10; };
  const exRaw = raw.exercise != null ? raw.exercise : raw.ex;
  put("steps", hkNum(raw.steps)); put("ex", /[a-z:]/i.test(String(exRaw || "")) ? hkDur(exRaw) : hkNum(exRaw));
  put("kcal", hkNum(raw.active != null ? raw.active : raw.kcal)); put("stand", hkNum(raw.stand)); if (o.stand > 24) { o.standMin = Math.round(o.stand); delete o.stand; } put("rhr", hkNum(raw.rhr)); put("hrv", hkNum(raw.hrv)); put("vo2", hkNum(raw.vo2));
  put("sleep", hkDur(raw.sleep)); put("deep", hkDur(raw.deep)); put("rem", hkDur(raw.rem));
  if (o.steps) o.steps = Math.round(o.steps);
  // Drop values no human produces (a mis-wired Shortcut variable, for example)
  const MAX = { steps: 100000, ex: 1000, kcal: 6000, stand: 24, standMin: 1440, rhr: 150, hrv: 300, vo2: 90, sleep: 960, deep: 600, rem: 600 };
  Object.keys(MAX).forEach(k => { if (o[k] != null && o[k] > MAX[k]) delete o[k]; });
  if (o.rhr != null && o.rhr < 25) delete o.rhr;
  if (o.sleep && o.sleep > 16 * 60) delete o.sleep; // a doubled-up iPhone + Watch reading; ignore rather than show 18 h
  return o;
}
function hkMerge(date, vals){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Object.keys(vals).length) return false;
  S.hk = S.hk || {}; const prev = hkClean(S.hk[date] ? { steps: S.hk[date].steps, ex: S.hk[date].ex, active: S.hk[date].kcal, stand: S.hk[date].stand != null ? S.hk[date].stand : S.hk[date].standMin, rhr: S.hk[date].rhr, hrv: S.hk[date].hrv, vo2: S.hk[date].vo2, sleep: S.hk[date].sleep != null ? S.hk[date].sleep + " min" : null, deep: S.hk[date].deep != null ? S.hk[date].deep + " min" : null, rem: S.hk[date].rem != null ? S.hk[date].rem + " min" : null } : {});
  S.hk[date] = { ...prev, ...vals }; return true;
}
/* Called from syncNow with the gist object; returns file names to delete. */
function hkTakeFiles(g){
  const done = [];
  Object.keys(g.files || {}).forEach(name => {
    const m = name.match(/^health-(\d{4}-\d{2}-\d{2})\.(json|txt)$/); if (!m) return;
    const txt = String(g.files[name].content || "");
    let raw = null; try { raw = JSON.parse(txt); } catch (e) {}
    // Shortcut format: "date=2026-10-16;steps=4078;sleep=5 hr 41 min;..."
    if (!raw && /=/.test(txt)) { raw = {}; txt.split(/[;\n]/).forEach(kv => { const i = kv.indexOf("="); if (i > 0) raw[kv.slice(0, i).trim().toLowerCase()] = kv.slice(i + 1).trim(); }); }
    if (raw) { hkMerge(raw.date && /^\d{4}-\d{2}-\d{2}$/.test(raw.date) ? raw.date : m[1], hkClean(raw)); S.hkAt = Date.now(); }
    done.push(name);
  });
  return done;
}
function hkDays(n){ const out = []; for (let i = n; i >= 1; i--) { const d = shiftDate(today(), -i); out.push({ d, v: (S.hk || {})[d] || {} }); } return out; }
function hkAvg(days, k){ const v = days.map(x => x.v[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function hkLatest(k){ const ks = Object.keys(S.hk || {}).sort().reverse(); for (const d of ks) if (S.hk[d][k] != null) return { d, v: S.hk[d][k] }; return null; }
function fmtSleep(m){ if (m == null) return "—"; const h = Math.floor(m / 60), mm = Math.round(m % 60); return h + "h " + String(mm).padStart(2, "0") + "m"; }
/* Recovery read for today: last night's sleep vs 7 h, and resting HR / HRV vs your own 30-day normal. */
function readiness(){
  if (!S.hk) return null;
  const y = S.hk[shiftDate(today(), -1)] || {}, base = hkDays(30);
  const rhrA = hkAvg(base, "rhr"), hrvA = hkAvg(base, "hrv"), flags = [];
  if (y.sleep && y.sleep < 360) flags.push("only " + fmtSleep(y.sleep) + " of sleep");
  if (y.rhr && rhrA && y.rhr >= rhrA + 5) flags.push("resting heart rate up " + Math.round(y.rhr - rhrA) + " bpm");
  if (y.hrv && hrvA && y.hrv <= hrvA * 0.8) flags.push("HRV " + Math.round((1 - y.hrv / hrvA) * 100) + "% below normal");
  if (!y.sleep && !y.rhr && !y.hrv) return null;
  return { low: flags.length > 0, flags, y };
}
function readinessCard(){
  const r = readiness(); if (!r || !r.low) return "";
  return `<div class="card" style="border-color:var(--gold)"><b class="gold">Recovery looks low today</b><div class="dim small" style="margin-top:4px;line-height:1.55">Your Watch shows ${r.flags.join(", ")}. Still train, but keep the weights you used last time instead of adding, and stop a rep or two shy of failure. Skip any hard cardio finisher.</div></div>`;
}
function hkTile(label, val, sub, cls){ return `<div class="card"><div class="dim small">${label}</div><div class="big ${cls || ""}">${val}</div><div class="dim small">${sub || "&nbsp;"}</div></div>`; }
function vsAvg(v, a, unit, goodUp){
  if (v == null || a == null) return "";
  const d = v - a, pct = a ? Math.abs(d) / a : 0; if (pct < 0.05) return "about your normal";
  const good = goodUp ? d > 0 : d < 0;
  return `<span class="${good ? "green" : "gold"}">${d > 0 ? "▲" : "▼"} ${Math.abs(Math.round(d))}${unit} vs 30-day avg</span>`;
}
function healthCardHTML(compact){
  const hk = S.hk || {};
  if (!Object.keys(hk).length) return compact ? "" : `<div class="card"><h3>Apple Health <span class="dim small">· steps, sleep, heart</span></h3><p class="dim small" style="margin-top:6px;line-height:1.55">Nothing has come in from your Watch yet. Set up the nightly Health Shortcut in <span class="blue" style="cursor:pointer" onclick="tab='settings';syncTabs();render()">Settings → Apple Health</span>, and your steps, exercise minutes, sleep and heart data will show up here every morning.</p></div>`;
  const yd = shiftDate(today(), -1), y = hk[yd] || {}, base = hkDays(30), wk = hkDays(7);
  const latestDate = Object.keys(hk).sort().pop();
  const stale = latestDate < yd;
  const trainedDays = new Set((S.logs || []).map(l => l.date));
  const tDays = base.filter(x => trainedDays.has(x.d) && x.v.steps), rDays = base.filter(x => !trainedDays.has(x.d) && x.v.steps);
  const sleepBefore = base.filter(x => trainedDays.has(x.d) && hk[x.d] && hk[x.d].sleep);
  const tiles = `<div class="statgrid" style="margin:10px 0 4px">
      ${hkTile("STEPS", y.steps != null ? y.steps.toLocaleString() : "—", y.steps != null ? vsAvg(y.steps, hkAvg(base, "steps"), "", true) : "")}
      ${hkTile("RINGS", y.kcal != null ? Math.round(y.kcal) + " kcal" : "—", [y.ex != null ? Math.round(y.ex) + " exercise min" : "", y.stand != null ? Math.round(y.stand) + " stand hrs" : y.standMin != null ? y.standMin + " stand min" : ""].filter(Boolean).join(" · ") || "move · exercise · stand")}
      ${hkTile("SLEEP", fmtSleep(y.sleep), y.deep || y.rem ? `deep ${fmtSleep(y.deep)} · REM ${fmtSleep(y.rem)}` : (y.sleep ? vsAvg(y.sleep, hkAvg(base, "sleep"), " min", true) : ""))}
      ${hkTile("RESTING HR", y.rhr != null ? Math.round(y.rhr) + " bpm" : "—", y.rhr != null ? vsAvg(y.rhr, hkAvg(base, "rhr"), " bpm", false) : "")}
      ${hkTile("HRV", y.hrv != null ? Math.round(y.hrv) + " ms" : "—", y.hrv != null ? vsAvg(y.hrv, hkAvg(base, "hrv"), " ms", true) : "")}
      ${(() => { const v = hkLatest("vo2"); return hkTile("VO₂ MAX", v ? v.v.toFixed(1) : "—", v ? "cardio fitness" + (v.d !== yd ? " · " + v.d.slice(5) : "") : ""); })()}
    </div>`;
  if (compact) return `<div class="card"><h3>Apple Health <span class="dim small">· yesterday</span></h3>${tiles}${readinessCard() ? '<div class="small gold" style="margin-top:6px"><b>Recovery looks low</b> — see Today.</div>' : ""}</div>`;
  return `<div class="card"><h3>Apple Health <span class="dim small">· yesterday${stale ? ` · last data ${latestDate.slice(5)}` : ""}</span></h3>
    ${stale ? `<p class="small gold" style="margin-top:6px">No Health data for yesterday yet. If your phone was locked at 12:01, iPhone blocks the Shortcut from reading Health — the backup morning run fills it in.</p>` : ""}
    ${tiles}
    <div class="dim small" style="font-weight:700;margin:10px 0 2px">STEPS · 30 DAYS <span style="font-weight:500">· avg ${hkAvg(base, "steps") ? Math.round(hkAvg(base, "steps")).toLocaleString() : "—"} · 7-day ${hkAvg(wk, "steps") ? Math.round(hkAvg(wk, "steps")).toLocaleString() : "—"}</span></div>
    <canvas id="hk-steps" width="520" height="110"></canvas>
    <div class="dim small" style="font-weight:700;margin:10px 0 2px">SLEEP · 30 DAYS <span style="font-weight:500">· avg ${fmtSleep(hkAvg(base, "sleep"))}</span></div>
    <canvas id="hk-sleep" width="520" height="110"></canvas>
    <div class="dim small" style="font-weight:700;margin:10px 0 2px">RESTING HEART RATE <span style="font-weight:500">· lower = fitter · avg ${hkAvg(base, "rhr") ? Math.round(hkAvg(base, "rhr")) + " bpm" : "—"}</span></div>
    <canvas id="hk-rhr" width="520" height="100"></canvas>
    <div class="dim small" style="font-weight:700;margin:10px 0 2px">HRV <span style="font-weight:500">· higher = better recovered · avg ${hkAvg(base, "hrv") ? Math.round(hkAvg(base, "hrv")) + " ms" : "—"}</span></div>
    <canvas id="hk-hrv" width="520" height="100"></canvas>
    ${tDays.length >= 2 && rDays.length >= 2 ? `<p class="dim small" style="margin-top:10px;line-height:1.55">🏋️ Training days average <b>${Math.round(hkAvg(tDays, "steps")).toLocaleString()}</b> steps; 🌙 rest days <b>${Math.round(hkAvg(rDays, "steps")).toLocaleString()}</b>.${sleepBefore.length >= 2 ? ` Sleep before training days: <b>${fmtSleep(hkAvg(sleepBefore, "sleep"))}</b>.` : ""}</p>` : ""}
  </div>`;
}
/* Small gap-aware chart: bars or a line over the last 30 days; workout days get a dot under the bar. */
function hkChart(id, key, opts){
  const c = document.getElementById(id); if (!c) return;
  const days = hkDays(30), vals = days.map(x => x.v[key] != null ? x.v[key] : null), have = vals.filter(v => v != null);
  const x = c.getContext("2d"), W = c.width, H = c.height, col = chartColors(); x.clearRect(0, 0, W, H);
  if (!have.length) { x.fillStyle = col.label; x.font = "12px sans-serif"; x.fillText("No data yet", 10, H / 2); return; }
  const trained = new Set((S.logs || []).map(l => l.date));
  const lo = opts.line ? Math.min(...have) - 2 : 0, hi = Math.max(...have, opts.goal || 0) || 1, rng = (hi - lo) || 1;
  const step = (W - 20) / vals.length, py = v => 12 + (1 - (v - lo) / rng) * (H - 34);
  if (opts.goal) { x.strokeStyle = col.label; x.setLineDash([4, 4]); x.lineWidth = 1; x.beginPath(); x.moveTo(10, py(opts.goal)); x.lineTo(W - 10, py(opts.goal)); x.stroke(); x.setLineDash([]); }
  if (opts.line) {
    x.strokeStyle = col.line; x.lineWidth = 2.2; x.beginPath(); let started = false;
    vals.forEach((v, i) => { if (v == null) return; const px = 10 + step * (i + 0.5); started ? x.lineTo(px, py(v)) : x.moveTo(px, py(v)); started = true; });
    x.stroke();
    vals.forEach((v, i) => { if (v == null) return; x.fillStyle = col.line; x.beginPath(); x.arc(10 + step * (i + 0.5), py(v), 2.4, 0, 7); x.fill(); });
  } else {
    vals.forEach((v, i) => { if (v == null) return; const h = Math.max(2, (v / hi) * (H - 34)); x.fillStyle = col.bar; x.beginPath(); x.roundRect(10 + step * i + 1.5, H - 22 - h, Math.max(2, step - 3), h, 2); x.fill(); });
  }
  days.forEach((dd, i) => { if (trained.has(dd.d)) { x.fillStyle = col.line; x.beginPath(); x.arc(10 + step * (i + 0.5), H - 12, 2.2, 0, 7); x.fill(); } });
  x.fillStyle = col.label; x.font = "10px sans-serif"; x.textAlign = "left";
  x.fillText(opts.fmt(Math.max(...have)), 10, 10); x.textAlign = "right"; x.fillText("● = workout day", W - 10, H - 1);
  x.textAlign = "left"; x.fillText(days[0].d.slice(5), 10, H - 1);
}
function drawHealthCharts(){
  hkChart("hk-steps", "steps", { goal: 8000, fmt: v => (v / 1000).toFixed(1) + "k" });
  hkChart("hk-sleep", "sleep", { goal: 420, fmt: v => fmtSleep(v) });
  hkChart("hk-rhr", "rhr", { line: true, fmt: v => Math.round(v) + " bpm" });
  hkChart("hk-hrv", "hrv", { line: true, fmt: v => Math.round(v) + " ms" });
}
function copyText(t, msg){ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast(msg)).catch(() => toast("Couldn't copy")); else toast("Copy not supported here"); }
const HK_TEMPLATE = '{"files":{"health-[Date].txt":{"content":"date=[Date];steps=[Steps];exercise=[Exercise];active=[Active];rhr=[RHR];hrv=[HRV];vo2=[VO2];sleep=[Sleep];deep=[Deep];rem=[REM]"}}}';
function healthSetupHTML(){
  const last = hkLatest("steps") || hkLatest("sleep") || hkLatest("rhr");
  if (!syncCfg || !syncCfg.gist) return `<label style="margin-top:14px">Nightly Health import (Shortcut)</label><p class="dim small">Turn on <b>Sync across devices</b> first — the Shortcut delivers your Health data through the same private gist.</p>`;
  return `<label style="margin-top:14px">Nightly Health import (Shortcut)</label>
    <p class="dim small" style="margin-bottom:6px">${last ? `<span class="green">✓ Receiving data</span> · latest day ${last.d}${S.hkAt ? " · arrived " + agoText(S.hkAt) : ""}` : "Not set up yet. Build the Shortcut using the steps you were given, then paste these three things into it:"}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small-btn" onclick="copyText('https://api.github.com/gists/' + syncCfg.gist, 'Gist address copied')">Copy gist address</button>
      <button class="btn ghost small-btn" onclick="copyText('Bearer ' + syncCfg.token, 'Copied — paste as the Authorization value')">Copy Authorization value</button>
      <button class="btn ghost small-btn" onclick="copyText(HK_TEMPLATE, 'Copied — paste it into the Text action')">Copy Shortcut text</button>
    </div>`;
}

/* ---- Init ---- */
applyTheme();
syncTabs();
render();
syncNow();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/gym/sw.js").catch(() => {});
