name: NBA publish card

# Leo NBA card (DEC-20261031-01): win chance and spread for every game, with
# the injury report as an input. No odds credits: lines and injuries come
# from ESPN's public feeds, results from the sportsdataverse release files.
#
# Every run re-reads the injury report and refreezes each game that has not
# tipped. Grading uses the LAST read before tip, so later runs only help.
# GitHub can start scheduled runs hours late, hence several waves. Dispatch
# by hand for an early tip (weekend afternoons).
#
# Eastern times below are EDT (UTC-4). In EST (from Nov 1) each runs an hour
# earlier in local time, which is still before tip.
#   10:00am  first card of the day
#    2:00pm  midday injury updates
#    5:30pm  after the 5pm official report
#    6:40pm  last pass before the 7pm wave

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "30 21 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD slate. Blank = today in America/New_York."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nba-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refuse merge-conflict markers
        run: bash scripts/check-conflict-markers.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(TZ="America/New_York" date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - name: Build the card
        id: build
        run: node scripts/generate-nba-slate.js "${{ steps.d.outputs.date }}"

      # Full season for the scoreboard's date picker (display only). Never blocks the run.
      - name: Season schedule
        run: node scripts/build-nba-schedule.js || echo "::warning::NBA schedule not refreshed"

      # Standings, Leo ratings, pace and efficiency for /nba/stats/ (display only).
      - name: Team stats
        run: node scripts/build-nba-team-stats.js || echo "::warning::NBA team stats not refreshed"

      # Every player's points per game and game log for /nba/players/ and the
      # matchup pages' box scores (display only). Never blocks the run.
      - name: Player scoring log
        run: node scripts/build-nba-player-log.js || echo "::warning::NBA player log not refreshed"

      - name: Matchup pages
        run: |
          node scripts/render-nba-matchup-pages.js "${{ steps.d.outputs.date }}"
          node scripts/build-nba-daily-pages.js "$(TZ=America/New_York date +%F)" "$(TZ=America/New_York date -d '-1 day' +%F)" || node scripts/build-nba-daily-pages.js
          node scripts/build-game-archives.js nba
          node scripts/build-nba-team-pages.js || true   # team pages (SEO-07); never fails the run
          node scripts/generate-sitemap.js

      - name: Health check
        run: node scripts/nba-healthcheck.js "${{ steps.d.outputs.date }}"

      # Members get the member brief (scripts/lib/nba-member-email.js, HO-0061);
      # the free list gets the short card (scripts/lib/nba-card-email.js) with
      # one line pointing to membership. Sent once per date by the first
      # run within 3 hours of the first tip (data/email-log/nba-card-<date>.json),
      # never after tip, and a no-op when the email secrets are missing.
      - name: Email the NBA member brief and free card
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LEO_SIGNUPS_TOKEN: ${{ secrets.LEO_SIGNUPS_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
        run: node scripts/send-nba-card-emails.js "${{ steps.d.outputs.date }}"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba nba sitemap.xml data/email-log
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "NBA card ${{ steps.d.outputs.date }}"
          git pull --rebase
          git push
