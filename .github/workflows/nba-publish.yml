name: NBA publish card

# Leo NBA card (DEC-20261031-01): win chance and spread for every game, with
# the injury report as an input. No odds credits: lines and injuries come
# from ESPN's public feeds, results from the sportsdataverse release files.
#
# Every run re-reads the injury report and refreezes each game that has not
# tipped. Grading uses the LAST read before tip, so later runs only help.
# GitHub can start scheduled runs hours late, hence several waves. Dispatch
# by hand for an early tip (weekend afternoons).
#
# Eastern times below are EDT (UTC-4). In EST (from Nov 1) each runs an hour
# earlier in local time, which is still before tip.
#   10:00am  first card of the day
#    2:00pm  midday injury updates
#    5:30pm  after the 5pm official report
#    6:40pm  last pass before the 7pm wave

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "30 21 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD slate. Blank = today in America/New_York."
        required: false
        type: string
      early:
        description: "true = early read for the 3 days AFTER the date (Lynold, 2026-11-24): the next 3 days of game pages with win chances, no picks, no emails or posts, never graded."
        required: false
        type: string
      only_if_tip_before:
        description: "HH:MM ET. Run only when today has an NBA tip before this time (the 2:47pm early-tip read). Blank = always run."
        required: false
        type: string
      preview_unless_tip_before:
        description: "HH:MM ET. Build today's card as an early read (no picks, posts or emails, not graded) unless today has a tip before this time; then build the graded card as usual. The 12:47pm runner row (Lynold, 2026-11-25: graded card after the 5pm injury report)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nba-publish
  cancel-in-progress: false

jobs:
  # The conditional early-tip read (Lynold, 2026-11-23; NBA-H28): the Leo runner starts this workflow at 2:47pm ET
  # with only_if_tip_before=17:00, and the card is rebuilt only on days with a tip before 5pm ET.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
      early: ${{ steps.p.outputs.early }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/nba/schedule.json
      - id: c
        env:
          BEFORE: ${{ github.event.inputs.only_if_tip_before }}
          DATE_IN: ${{ github.event.inputs.date }}
        run: |
          if [ -z "$BEFORE" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e '
            const s = require("./data/nba/schedule.json"), before = process.env.BEFORE;
            const d = process.env.DATE_IN || new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
            const day = (s.days || []).find(x => x.date === d) || { games: [] };
            const et = t => new Date(t).toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
            const early = day.games.filter(g => et(g.tip_utc) < before);
            console.log(`${d}: ${day.games.length} games, ${early.length} tip before ${before} ET`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `go=${early.length ? "true" : "false"}\n`);'
      # Graded card after the 5pm ET injury report (Lynold, 2026-11-25). The 12:47pm run builds today's card as an
      # early read unless a game tips before PREVIEW_BEFORE; the 5:47pm run then builds the graded card (posts, card
      # email, picks, the published read). Days with an earlier tip keep the 12:47pm and 2:47pm graded reads.
      - id: p
        env:
          EARLY_IN: ${{ github.event.inputs.early }}
          PREVIEW_BEFORE: ${{ github.event.inputs.preview_unless_tip_before }}
          DATE_IN: ${{ github.event.inputs.date }}
        run: |
          if [ "$EARLY_IN" = "true" ]; then echo "early=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$PREVIEW_BEFORE" ]; then echo "early=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e '
            const s = require("./data/nba/schedule.json"), before = process.env.PREVIEW_BEFORE;
            const d = process.env.DATE_IN || new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
            const day = (s.days || []).find(x => x.date === d) || { games: [] };
            const et = t => new Date(t).toLocaleTimeString("en-GB", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
            const soon = day.games.filter(g => et(g.tip_utc) < before);
            console.log(`${d}: ${soon.length} tip before ${before} ET -> ${soon.length ? "graded card" : "early read (preview)"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `early=${soon.length ? "false" : "true"}\n`);'

  publish:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refuse merge-conflict markers
        run: bash scripts/check-conflict-markers.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(TZ="America/New_York" date +%F)
          LIST="$D"
          # Early read: the next 3 days of games (Lynold, 2026-11-24: "Build 3 days ahead"), so the pages can
          # be indexed before game day. A day with no games writes nothing; a day that already has a game-day
          # card is skipped by generate-nba-slate.js.
          if [ "${{ github.event.inputs.early }}" = "true" ]; then
            LIST="$(date -d "$D + 1 day" +%F) $(date -d "$D + 2 day" +%F) $(date -d "$D + 3 day" +%F)"
            D=$(date -d "$D + 1 day" +%F)
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "dates=$LIST" >> "$GITHUB_OUTPUT"

      - name: Build the card
        id: build
        run: |
          if [ "${{ needs.check.outputs.early }}" = "true" ]; then
            for d in ${{ steps.d.outputs.dates }}; do node scripts/generate-nba-slate.js "$d" --early; done
          else
            node scripts/generate-nba-slate.js "${{ steps.d.outputs.date }}"
          fi

      # Full season for the scoreboard's date picker (display only). Never blocks the run.
      - name: Season schedule
        run: node scripts/build-nba-schedule.js || echo "::warning::NBA schedule not refreshed"

      # Standings, Leo ratings, pace and efficiency for /nba/stats/ (display only).
      - name: Team stats
        run: node scripts/build-nba-team-stats.js || echo "::warning::NBA team stats not refreshed"

      # Every player's points per game and game log for /nba/players/ and the
      # matchup pages' box scores (display only). Never blocks the run.
      - name: Player scoring log
        run: node scripts/build-nba-player-log.js || echo "::warning::NBA player log not refreshed"

      - name: Matchup pages
        run: |
          node scripts/render-nba-matchup-pages.js ${{ steps.d.outputs.dates }}
          node scripts/build-nba-daily-pages.js "$(TZ=America/New_York date +%F)" "$(TZ=America/New_York date -d '-1 day' +%F)" || node scripts/build-nba-daily-pages.js
          node scripts/build-game-archives.js nba
          node scripts/build-matchup-pages.js nba || true   # permanent matchup pages (Lynold, 2026-11-25)
          node scripts/build-nba-team-pages.js || true   # team pages (SEO-07); never fails the run
          node scripts/generate-sitemap.js

      # X post words for the picks of the day (HO-0087 part B): data/nba/social/<date>.json,
      # refreshed until the first tip, then frozen. Display only; never blocks the run.
      - name: Social posts
        if: needs.check.outputs.early != 'true'
        run: node scripts/build-nba-social.js "${{ steps.d.outputs.date }}" || echo "::warning::NBA social posts not written"

      - name: Health check
        if: needs.check.outputs.early != 'true'
        run: node scripts/nba-healthcheck.js "${{ steps.d.outputs.date }}"

      # Members get the member brief (scripts/lib/nba-member-email.js, HO-0061);
      # the free list gets the short card (scripts/lib/nba-card-email.js) with
      # one line pointing to membership. Sent once per date by the first
      # run within 3 hours of the first tip (data/email-log/nba-card-<date>.json),
      # never after tip, and a no-op when the email secrets are missing.
      - name: Email the NBA member brief and free card
        if: needs.check.outputs.early != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LEO_SIGNUPS_TOKEN: ${{ secrets.LEO_SIGNUPS_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
        run: node scripts/send-nba-card-emails.js "${{ steps.d.outputs.date }}"

      # Lynold's X post graphics (Leo Manager, 2026-11-18): each new post in
      # data/nba/social/ drawn by scripts/render-post-card.js and emailed to him from
      # cards@ndhorizon.com; once per post, picks again only if the picks changed.
      # Logged in data/email-log/x-posts-nba-<date>.json. Never blocks the run.
      - name: Email X post graphics to Lynold
        if: needs.check.outputs.early != 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: node scripts/send-x-posts.js nba "${{ steps.d.outputs.date }}" || true

      - name: Leo Parlay (build, grade, email the post)
        if: needs.check.outputs.early != 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: |
          node scripts/build-leo-parlay.js || true
          node scripts/send-x-posts.js parlay "$(TZ=America/New_York date -d yesterday +%F)" "$(TZ=America/New_York date +%F)" || true

      - name: Prediction files for trackers
        if: needs.check.outputs.early != 'true'
        continue-on-error: true
        run: node scripts/build-prediction-files.js nba || true

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba data/predictions nba/results nfl/results/index.html $(ls -d data/parlay parlay 2>/dev/null) nba sitemap.xml data/email-log $(ls -d x 2>/dev/null)
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "NBA card ${{ steps.d.outputs.date }}"
          # Retry: on busy days other workflows push between our checkout and our push (Nov 15 12:41pm card lost).
          # On a sitemap.xml clash keep ours, then rebuild the sitemap from the merged tree.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs && node scripts/generate-sitemap.js \
               && { git add sitemap.xml; git diff --cached --quiet || git commit -q --amend --no-edit; } \
               && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying."; sleep $((i * 6))
          done
          exit 1

      - name: Tell search engines about new pages (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow-ping.js --since=${{ github.sha }} || true
