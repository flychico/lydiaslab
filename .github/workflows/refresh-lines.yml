name: Refresh prop, totals, and moneyline lines

# Re-captures K-prop, totals, and moneyline lines + projections for today.
# Touches ONLY data/k-props/, data/totals/, and data/moneyline-odds/ — never
# picks, previews, or results.
#
# Scheduled once daily near 10:50am ET (the time publish-picks.yml's own cron
# comments already assumed this ran) plus workflow_dispatch for manual
# re-capture. Before ERR-20260801-02 this workflow never captured moneyline
# odds at all, and had no schedule -- either gap alone meant every matchup
# page showed "Market probability: Not available" unless someone manually
# ran it same-day.
on:
  schedule:
    - cron: "50 14 * * *"   # 10:50am ET (EDT, UTC-4)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture strikeout prop lines + projections
        run: node scripts/update-k-props.js

      - name: Capture totals lines + projections
        run: node scripts/update-totals.js

      - name: Capture moneyline odds
        run: node scripts/update-moneyline-odds.js

      - name: Commit and push if changed
        run: |
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/k-props/ data/totals/ data/moneyline-odds/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh prop and totals lines $(TZ=America/New_York date +%F-%H%M)"
            git pull --rebase
            git push
          fi
