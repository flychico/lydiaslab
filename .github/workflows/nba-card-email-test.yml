name: NBA card email (test send)

# Test copies of the NBA emails for a date, sent through Resend to the owner
# only (AUDIT_EMAIL secret), subjects marked TEST. "card" sends the member
# brief and the free card for that slate; "review" sends the morning-after
# review for that graded night. No subscribers, no timing gates, no email log.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD card to send. Blank = today in America/New_York."
        required: false
        type: string
      which:
        description: "card (member brief and free card) or review (morning-after review)"
        required: false
        default: card
        type: choice
        options: [card, review]

permissions:
  contents: read

jobs:
  test-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send the test
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D=$(TZ="America/New_York" date +%F)
          if [ "${{ github.event.inputs.which }}" = "review" ]; then
            node scripts/send-nba-member-review.js "$D" --test
          else
            node scripts/send-nba-card-emails.js "$D" --test
          fi
