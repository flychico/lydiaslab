name: Publish picks

# Publishing only. Runs LAST.
#
# Rebuilt 2026-08-03. Everything that gathers data moved to prepare-slate.yml;
# the manual pitching-plan editor moved to pitching-plan.yml; the Research Desk
# was dropped. What is left is what the name says: run the moneyline model over
# data that has already been gathered and committed, lock the card, render the
# pages, email.
#
# REMOVED IN THE REBUILD, and why
#   - Apply manual pitching plan     -> pitching-plan.yml. Changing one opener
#                                       should not require regenerating every
#                                       matchup page and risking an email.
#   - Refresh totals projections     -> prepare-slate.yml, where it runs AFTER
#                                       the bullpen file exists. It ran before
#                                       it here, so totals were built with no
#                                       bullpen input at all. ERR-20260803-01.
#   - Provisional source data pass   -> prepare-slate.yml. This was the first of
#                                       two full model passes; the second one
#                                       below is now the only one. The round
#                                       trip existed so totals could sit between
#                                       them, and totals no longer lives here.
#   - Refresh LyDia Research Desk    -> dropped entirely. A content scraper with
#                                       no relationship to picks, running five
#                                       times a day because publish did.
#
# DAILY ORDER
#   Prepare slate  ->  (optional Pitching plan, then Prepare slate again)  ->  Publish picks

on:
  schedule:
    # GitHub cron is UTC (EDT = UTC-4 in season). One run per first-pitch wave,
    # each ~15 minutes after that wave's prepare-slate run. Concurrency below
    # serializes them.
#    - cron: "5 15 * * *"    # 11:05am ET — covers the 12:00pm wave
#    - cron: "20 16 * * *"   # 12:20pm ET — covers the 1:30pm wave
#    - cron: "35 18 * * *"   # 2:35pm ET  — covers the 3:30/4:15pm wave
    - cron: "30 21 * * *"   # 5:30pm ET  — covers the 6:35/7:10pm wave    
    - cron: "30 23 * * *"   # 7:30pm ET  — covers the 8:35/9:10pm wave

  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to publish. Blank for today in America/New_York."
        required: false
        default: ""
      snapshot:
        description: "posted, current, or closing"
        required: false
        default: "posted"
      send_email:
        description: "Email picks to paid members? Only set true after approval."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish-picks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No ODDS_API_KEY, deliberately. This workflow spends nothing and can be
    # re-run freely. Every paid call happens in prepare-slate.yml and is
    # committed before this runs.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve publish date
        id: publish_date
        run: |
          echo "UTC:"; date -u
          echo "Eastern:"; TZ="America/New_York" date
          DATE_INPUT="${{ github.event.inputs.date }}"
          if [ -z "$DATE_INPUT" ]; then
            DATE_INPUT=$(TZ="America/New_York" date +%F)
          fi
          echo "date=$DATE_INPUT" >> "$GITHUB_OUTPUT"
          echo "Resolved publish date: $DATE_INPUT"

      # Publish now depends on prepare-slate having run. Say so plainly rather
      # than letting the model silently build on a missing or stale capture.
      - name: Confirm the slate was prepared
        run: |
          DATE="${{ steps.publish_date.outputs.date }}"
          MISSING=""
          for f in "data/bullpen/$DATE.json" "data/totals/$DATE.json"; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Slate not prepared for $DATE. Missing:$MISSING"
            echo "Run 'Prepare slate (gather data)' first, then re-run this workflow."
            exit 1
          fi
          echo "Slate present for $DATE:"
          for f in data/bullpen data/k-props data/totals data/moneyline-odds; do
            [ -f "$f/$DATE.json" ] && printf "  %-28s %s bytes\n" "$f/$DATE.json" "$(wc -c < "$f/$DATE.json")" || printf "  %-28s absent\n" "$f/$DATE.json"
          done

      - name: Verify totals capture matches confirmed probables
        run: node scripts/verify-totals-freshness.js "${{ steps.publish_date.outputs.date }}"
        
      - name: Clean invalid generated artifacts
        run: node scripts/site-health-cleanup.js --fix

      - name: Normalize Pitcher Matchup Tool source
        run: node scripts/normalize-pitcher-tool-source.js

      # The only model pass. Reads the committed slate, runs the moneyline
      # model, appends to the day's card and writes the member brief.
      - name: Run the moneyline model and lock picks
        run: |
          SNAPSHOT_INPUT="${{ github.event.inputs.snapshot }}"
          node scripts/generate-member-lab.js \
            --date "${{ steps.publish_date.outputs.date }}" \
            --snapshot "${SNAPSHOT_INPUT:-posted}"

      # 2026-08-15, Lynold's explicit instruction: the same pregame model
      # inputs/derived-calc columns as attribution_model_log.csv, captured
      # same-day from the member brief this step just wrote -- BEFORE
      # daily-recap.yml grades anything tomorrow morning. Upserts by
      # (date, gamePk), so later publish waves the same day (pitcher
      # confirmations, line moves) overwrite this run's rows rather than
      # duplicating them. See scripts/export-pregame-attribution.js.
      - name: Export pregame attribution snapshot
        run: node scripts/export-pregame-attribution.js "${{ steps.publish_date.outputs.date }}"

      # 2026-08-15, Lynold's explicit instruction: the same pitcher-level
      # inputs behind pitcher_score (era/whip/ip/so/bb/gs/gp from MLB StatsAPI,
      # plus the derived score components) for every probable in today's
      # member brief -- captured same-day, before the recap. Also computes an
      # independent roleShare-over-5 comparison column alongside the live
      # (roleShare-over-5.5) published score; does not touch the live model.
      # See scripts/export-pitcher-data.js.
      - name: Export daily pitcher data
        run: node scripts/export-pitcher-data.js "${{ steps.publish_date.outputs.date }}"

      - name: Generate canonical Pitcher Matchup Tool data
        run: node scripts/generate-pitcher-matchup-data.js "${{ steps.publish_date.outputs.date }}"

      - name: Render bettor-friendly previews
        run: node scripts/generate-previews.js "${{ steps.publish_date.outputs.date }}"

      - name: Generate matchup pages with indexing quality gate
        run: node scripts/generate-matchup-pages.js "${{ steps.publish_date.outputs.date }}"

      - name: Verify matchup pages use Pitcher Matchup Tool data
        run: node scripts/verify-pitcher-matchup-alignment.js "${{ steps.publish_date.outputs.date }}"

      - name: Verify opener and bulk pitching plans flow through every model
        run: node scripts/verify-pitching-plans.js "${{ steps.publish_date.outputs.date }}"

      - name: Verify unified Picks and full-day bullpen retention
        run: node scripts/verify-picks-bullpen.js "${{ steps.publish_date.outputs.date }}"

      - name: Verify official totals, K props, and team-total research markets
        run: |
          node scripts/test-official-market-grading.js
          node scripts/verify-official-markets.js "${{ steps.publish_date.outputs.date }}"

      - name: Refresh learning summary and verify synchronized policy
        run: |
          node scripts/generate-learning-summary.js
          node scripts/verify-learning-lab.js --require-current-totals

      - name: Normalize and verify Google Analytics
        run: |
          node scripts/normalize-public-shell.js
          node scripts/verify-google-analytics.js

      - name: Verify generated data and public copy
        run: |
          DATE_INPUT="${{ steps.publish_date.outputs.date }}"
          test -f "data/member-brief/$DATE_INPUT.json" || { echo "ERROR: member brief missing"; exit 1; }
          test -f "data/published-picks/$DATE_INPUT.json" || { echo "ERROR: official pick file missing"; exit 1; }
          test -f "previews/$DATE_INPUT.html" || { echo "ERROR: preview page missing"; exit 1; }
          test -f "data/pitcher-matchups/$DATE_INPUT.json" || { echo "ERROR: canonical pitcher data missing"; exit 1; }
          test -f "data/matchup-pages/$DATE_INPUT.json" || { echo "ERROR: matchup manifest missing"; exit 1; }
          test -f "mlb/matchups/index.html" || { echo "ERROR: matchup archive missing"; exit 1; }
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('data/member-brief/$DATE_INPUT.json','utf8')); const p=JSON.parse(fs.readFileSync('data/published-picks/$DATE_INPUT.json','utf8')); const s=JSON.parse(fs.readFileSync('data/pitcher-matchups/$DATE_INPUT.json','utf8')); const m=JSON.parse(fs.readFileSync('data/matchup-pages/$DATE_INPUT.json','utf8')); if(!Array.isArray(b.games)||b.games.length===0) throw new Error('member brief has zero games'); if(!Array.isArray(p.picks)) throw new Error('official pick file has no picks array'); const pitcherGames=s.games||{}; const missingPitcherRows=b.games.filter(g=>!pitcherGames[String(g.game_pk)]); if(missingPitcherRows.length) throw new Error('missing pitcher data for member-brief games: '+missingPitcherRows.map(g=>g.game_pk).join(',')); if(!Array.isArray(m.pages)||m.total_pages!==m.pages.length) throw new Error('matchup manifest page count is invalid'); const manifestPks=new Set(m.pages.map(x=>String(x.game_pk))); const missingBriefPages=b.games.filter(g=>!manifestPks.has(String(g.game_pk))); if(missingBriefPages.length) throw new Error('member-brief games missing matchup pages: '+missingBriefPages.map(g=>g.game_pk).join(',')); const outputs=m.pages.map(x=>x.output); if(new Set(outputs).size!==outputs.length) throw new Error('duplicate matchup output paths detected'); if(m.pages.some(x=>!fs.existsSync(x.output))) throw new Error('one or more matchup pages are missing'); console.log('Active games:', b.games.length, 'Official picks:', p.picks.length, 'Pitcher rows available:', Object.keys(pitcherGames).length, 'Matchup pages retained:', m.total_pages, 'Indexable:', m.indexable_pages);"
          node scripts/assert-public-clean.js
          echo "Source data, previews and matchup pages verified."

      - name: Commit and push if changed
        run: |
          DATE_INPUT="${{ steps.publish_date.outputs.date }}"
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"

          # Generated outputs are authoritative for these paths. Snapshot them
          # before synchronizing with main so a concurrent manual upload cannot
          # cause a rebase conflict at the end of an otherwise valid publish.
          # "articles" is gone with the Research Desk.
          GENERATED_PATHS=(previews picks data sitemap.xml member-brief results tools mlb)
          SNAPSHOT_DIR=$(mktemp -d)
          for path in "${GENERATED_PATHS[@]}"; do
            if [ -e "$path" ]; then
              mkdir -p "$SNAPSHOT_DIR/$(dirname "$path")"
              cp -a "$path" "$SNAPSHOT_DIR/$path"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          for path in "${GENERATED_PATHS[@]}"; do
            if [ -d "$SNAPSHOT_DIR/$path" ]; then
              mkdir -p "$path"
              rsync -a --delete "$SNAPSHOT_DIR/$path/" "$path/"
            elif [ -f "$SNAPSHOT_DIR/$path" ]; then
              cp -a "$SNAPSHOT_DIR/$path" "$path"
            fi
          done

          # -A, not a path list. A hardcoded add list goes stale the moment a
          # generator writes somewhere new, and the failure surfaces as an
          # unrelated git error. ERR-20260720, and again ERR-20260803-02.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish picks $DATE_INPUT"
            git push
          fi

      - name: Check if today's member emails already went out
        # Publish runs several times a day to catch each wave's posted lineups.
        # Only the first scheduled run of the day emails; later runs update the
        # card and pages silently. The marker is committed so this survives runs.
        id: email_gate
        run: |
          DATE_INPUT="${{ steps.publish_date.outputs.date }}"
          MARKER="data/email-log/$DATE_INPUT.json"
          if [ -f "$MARKER" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "Emails already went out today per $MARKER — this run updates picks only."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            echo "No email marker for $DATE_INPUT yet — this run is eligible to send."
          fi

      - name: Email picks to paid members
        if: ${{ (github.event_name == 'schedule' && steps.email_gate.outputs.already_sent != 'true') || github.event.inputs.send_email == 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node scripts/send-member-emails.js "${{ steps.publish_date.outputs.date }}"

      - name: Email free daily preview to the free list
        if: ${{ (github.event_name == 'schedule' && steps.email_gate.outputs.already_sent != 'true') || github.event.inputs.send_email == 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node scripts/send-free-preview-emails.js "${{ steps.publish_date.outputs.date }}"

      - name: Record that today's emails went out
        if: ${{ (github.event_name == 'schedule' && steps.email_gate.outputs.already_sent != 'true') || github.event.inputs.send_email == 'true' }}
        run: |
          DATE_INPUT="${{ steps.publish_date.outputs.date }}"
          mkdir -p data/email-log
          cat > "data/email-log/$DATE_INPUT.json" <<JSON
          {"date": "$DATE_INPUT", "sent_at_utc": "$(date -u +%FT%TZ)", "trigger": "${{ github.event_name }}", "run_id": "${{ github.run_id }}"}
          JSON
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/email-log
          if git diff --cached --quiet; then
            echo "Email marker unchanged."
          else
            git commit -m "Record email delivery $DATE_INPUT"
            git pull --rebase
            git push
          fi
