name: Thanksgiving week offer (free list)

# One email to the free list on Friday Nov 27, 2026: how Leo's Thanksgiving
# calls did and "try a week for $10" (DEC-20261125-02). The Leo Manager's
# scheduled task starts it at 9am ET; scripts/send-free-week-offer.js sends
# only that Friday 7am to 1pm ET and only once. Owned by the Leo Manager chat.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send one TEST copy to the AUDIT_EMAIL secret only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: free-week-offer
  cancel-in-progress: false

jobs:
  offer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Email the free list
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LEO_SIGNUPS_TOKEN: ${{ secrets.LEO_SIGNUPS_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: node scripts/send-free-week-offer.js ${{ github.event.inputs.test == 'true' && '--test' || '' }}
      - name: Commit the email log
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/email-log
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Thanksgiving week offer email log"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 6))
          done
          echo "Push failed after 5 tries"; exit 1
