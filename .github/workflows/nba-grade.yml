name: NBA grade results

# Grades yesterday's frozen NBA reads against ESPN finals, then re-grades any
# frozen game from the last 14 days that is still missing (catch-up).
# Writes data/nba/results-ledger.csv and data/nba/results.json.
# Wave runs (input wave=true, HO-0076) grade today's games that are already
# final, so results can be posted the same night. The grader writes each final
# once and skips graded games, so the 2:10am run still grades the rest of the
# date. Box scores and miss reasons are rebuilt for the last 3 days then.
# Crons are UTC with no daylight saving. Times below are Eastern Standard
# Time (from Nov 1, 2026); add one hour while daylight saving is on.
#   07:00 UTC = 2:00am ET  after the late West Coast games
#   12:30 UTC = 7:30am ET  backstop
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to grade. Blank = yesterday in America/New_York."
        required: false
        type: string
      wave:
        description: "Wave run (HO-0076): grade today's games that are final, rebuild their pages and the results page, write data/nba/waves/<date>.json. The 2:10am run grades the rest."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nba-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grade
        id: g
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ] && [ "${{ github.event.inputs.wave }}" = "true" ]; then D="$(TZ=America/New_York date +%F)"; fi
          if [ -z "$D" ]; then D="$(TZ=America/New_York date -d '-1 day' +%F)"; fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          node scripts/grade-nba-results.js --date="$D"

      # Results page, day by day: miss reasons, upsets and what Leo is learning
      # (HO-0031, DEC-20261110-30). Built from the graded files; never blocks the run.
      - name: Results page
        run: node scripts/build-nba-results-page.js || echo "::warning::NBA results page not rebuilt"

      # Leo data feed sample (HO-0063 part B): the last 7 graded days and the
      # schema in data/feed/nba/. Leo's own output only, no sportsbook numbers.
      # The full season file is only written with --out and is never committed.
      - name: Data feed sample
        if: github.event.inputs.wave != 'true'
        run: node scripts/build-nba-feed.js || echo "::warning::NBA feed sample not rebuilt"

      # Every player's points per game and game log for /nba/players/ and the
      # matchup pages' box scores (display only). Never blocks the run.
      - name: Player scoring log
        if: github.event.inputs.wave != 'true'
        run: node scripts/build-nba-player-log.js || echo "::warning::NBA player log not refreshed"

      # Standings, Leo ratings, pace and efficiency for /nba/stats/ (display only).
      - name: Team stats
        if: github.event.inputs.wave != 'true'
        run: node scripts/build-nba-team-stats.js || echo "::warning::NBA team stats not refreshed"

      # Full season for the scoreboard's date picker (display only). Never blocks the run.
      - name: Season schedule
        if: github.event.inputs.wave != 'true'
        run: node scripts/build-nba-schedule.js || echo "::warning::NBA schedule not refreshed"

      # Add the final and the grade to the last three days' game pages.
      - name: Matchup pages
        run: |
          if [ "${{ github.event.inputs.wave }}" = "true" ]; then node scripts/render-nba-matchup-pages.js "${{ steps.g.outputs.date }}"; else
          node scripts/render-nba-matchup-pages.js $(for k in 1 2 3; do TZ=America/New_York date -d "-$k day" +%F; done); fi
          node scripts/build-nba-daily-pages.js "$(TZ=America/New_York date +%F)" "$(TZ=America/New_York date -d '-1 day' +%F)" || node scripts/build-nba-daily-pages.js
          node scripts/build-game-archives.js nba
          node scripts/build-nba-team-pages.js || true   # team pages (SEO-07); never fails the run
          node scripts/generate-sitemap.js

      # Grading waves for the share posts (HO-0076): appends any wave of the graded
      # date whose games are all final; never rewrites one. Never blocks the run.
      - name: Grading waves
        run: node scripts/build-nba-waves.js "${{ steps.g.outputs.date }}" || echo "::warning::NBA waves not written"

      # X post words for each new wave and the whole night (HO-0087 part B), from the
      # waves file, ledger, misses and box scores. Never rewrites a post; never blocks the run.
      - name: Social posts
        run: node scripts/build-nba-social.js "${{ steps.g.outputs.date }}" || echo "::warning::NBA social posts not written"

      # Lynold's X post graphics (Leo Manager, 2026-11-18): each new post in
      # data/nba/social/ drawn by scripts/render-post-card.js and emailed to him from
      # cards@ndhorizon.com; once per post, picks again only if the picks changed.
      # Logged in data/email-log/x-posts-nba-<date>.json. Never blocks the run.
      - name: Email X post graphics to Lynold
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: node scripts/send-x-posts.js nba "${{ steps.g.outputs.date }}" || true

      - name: Leo Parlay (build, grade, email the post)
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: |
          node scripts/build-leo-parlay.js || true
          node scripts/send-x-posts.js parlay "$(TZ=America/New_York date -d yesterday +%F)" "$(TZ=America/New_York date +%F)" || true

      # The daily recap behind Lynold's one morning email (Leo Manager, 2026-11-22). Public data only.
      - name: Daily recap for the Leo Daily Brief
        continue-on-error: true
        run: node scripts/build-daily-recap.js || true

      - name: Prediction files for trackers
        continue-on-error: true
        run: node scripts/build-prediction-files.js nba || true

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba data/predictions nba/results nfl/results/index.html $(ls -d data/parlay parlay 2>/dev/null) data/feed/nba nba sitemap.xml data/email-log data/daily-recap-latest.json data/daily-recap $(ls -d x 2>/dev/null)
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "NBA grade results ${{ steps.g.outputs.date }}${{ github.event.inputs.wave == 'true' && ' (wave)' || '' }}"
          # Retry: on busy days other workflows push between our checkout and our push (Nov 15 12:41pm card lost).
          # On a sitemap.xml clash keep ours, then rebuild the sitemap from the merged tree.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs && node scripts/generate-sitemap.js \
               && { git add sitemap.xml; git diff --cached --quiet || git commit -q --amend --no-edit; } \
               && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying."; sleep $((i * 6))
          done
          exit 1

      - name: Tell search engines about new pages (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow-ping.js --since=${{ github.sha }} || true
