name: NBA grade results

# Grades yesterday's frozen NBA reads against ESPN finals, then re-grades any
# frozen game from the last 14 days that is still missing (catch-up).
# Writes data/nba/results-ledger.csv and data/nba/results.json.
# Crons are UTC with no daylight saving. Times below are Eastern Standard
# Time (from Nov 1, 2026); add one hour while daylight saving is on.
#   07:00 UTC = 2:00am ET  after the late West Coast games
#   12:30 UTC = 7:30am ET  backstop
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to grade. Blank = yesterday in America/New_York."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nba-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grade
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -n "$D" ]; then node scripts/grade-nba-results.js --date="$D"; else node scripts/grade-nba-results.js; fi

      # Full season for the scoreboard's date picker (display only). Never blocks the run.
      # Standings, Leo ratings, pace and efficiency for /nba/stats/ (display only).
      - name: Team stats
        run: node scripts/build-nba-team-stats.js || echo "::warning::NBA team stats not refreshed"

      - name: Season schedule
        run: node scripts/build-nba-schedule.js || echo "::warning::NBA schedule not refreshed"

      # Add the final and the grade to the last three days' game pages.
      - name: Matchup pages
        run: |
          node scripts/render-nba-matchup-pages.js $(for k in 1 2 3; do TZ=America/New_York date -d "-$k day" +%F; done)
          node scripts/build-game-archives.js nba
          node scripts/generate-sitemap.js

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba nba sitemap.xml
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "NBA grade results $(TZ=America/New_York date +%F)"
          git pull --rebase
          git push
