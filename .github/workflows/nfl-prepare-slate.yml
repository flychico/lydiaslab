name: NFL prepare slate (gather data)

# NFL counterpart to prepare-slate.yml. Same shape, different rhythm: the NFL
# plays Thu / Sun / Mon rather than daily, so this gathers every morning
# (lines move all week) and adds waves on the three game days.
#
# CRON IS UTC AND DOES NOT FOLLOW DST. Each line below gives both Eastern
# times: EDT (UTC-4, through the first Sunday of November and again from the
# second Sunday of March) and EST (UTC-5, in between). From 2026-11-01 every
# wave fires one hour EARLIER in ET. Kept on purpose (DEC-20261031-03): the
# Sunday last capture moves from 12:30pm to 11:30am EST, which leaves more
# room before the 1pm kicks for runs that land late. The cost: the 4:05/4:25
# games' last capture moves to 1:00pm EST, about 3 hours before kickoff.
# prepare-slate.yml was once rebuilt because its comments disagreed with its
# crons, so this file states the drift instead of hiding it.
#
# WEEKLY RHYTHM (EDT / EST)
#   NFL prepare slate  ->  NFL publish picks (fires 15 min after each wave)
#
# OFF THE HOUR (DEC-20261102-03): GitHub dropped both Monday Nov 2 gathers
# (8am and 12pm EST, both on the hour), so every wave now runs at :53 and
# Monday and Thursday nights get a backup gather at :07 an hour later.
#   Daily     8:53am / 7:53am     line movement through the week
#   Thursday  12:53pm / 11:53am, backup 2:07pm / 1:07pm   before TNF
#   Sunday    7:00am / 6:00am, 10:00am / 9:00am   before the 1:00pm block
#   Sunday    12:30pm / 11:30am   last capture before the 1:00pm block
#   Sunday    2:00pm / 1:00pm     before the 4:05/4:25 block
#   Sunday    6:00pm / 5:00pm     before SNF
#   Monday    12:53pm / 11:53am, backup 2:07pm / 1:07pm   before MNF

on:
  schedule:
    - cron: "53 12 * * *"   # 8:53am EDT / 7:53am EST  daily
    - cron: "53 16 * * 4"   # 12:53pm EDT / 11:53am EST  Thursday -- before TNF
    - cron: "7 18 * * 4"    # 2:07pm EDT / 1:07pm EST  Thursday -- backup gather
    - cron: "53 10 * * 0"   # 6:53am EDT / 5:53am EST  Sunday -- first wave
    - cron: "53 13 * * 0"   # 9:53am EDT / 8:53am EST  Sunday
    # PRE-KICKOFF CAPTURE. Added 2026-09-20 after the first live run showed
    # the 9:39am ET fetch was too early: books had not posted full prop menus
    # yet (Ladd McConkey, a front-line receiver, had no receiving line at all
    # -- the book listed only 9 players for that game). A line captured 3+
    # hours before kickoff is not a closing line, and CLV measured against it
    # is measuring the wrong number.
    - cron: "30 16 * * 0"   # 12:30pm EDT / 11:30am EST  Sunday -- last capture before 1pm kicks
    - cron: "53 17 * * 0"   # 1:53pm EDT / 12:53pm EST  Sunday
    - cron: "53 21 * * 0"   # 5:53pm EDT / 4:53pm EST  Sunday
    - cron: "53 16 * * 1"   # 12:53pm EDT / 11:53am EST  Monday -- before MNF
    - cron: "7 18 * * 1"    # 2:07pm EDT / 1:07pm EST  Monday -- backup gather
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD slate to gather. Blank = next slate date in America/New_York."
        required: false
        type: string
      early:
        description: "Also build early reads and game pages for the next 6 days"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Never let two gathers overlap -- they write the same files.
concurrency:
  group: nfl-prepare-slate
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refuse merge-conflict markers
        run: bash scripts/check-conflict-markers.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The NFL models read open nflverse data over plain HTTPS and need no
      # API key. That is why there is no key-presence gate here, unlike the
      # MLB gather -- there is nothing to silently fail on.
      - name: Resolve slate date
        id: slate_date
        run: |
          set -euo pipefail
          echo "UTC:";      date -u
          echo "Eastern:";  TZ="America/New_York" date
          DATE_INPUT="${{ github.event.inputs.date }}"
          if [ -z "$DATE_INPUT" ]; then
            # Default to today; if today has no games the model writes an empty
            # slate and the commit step no-ops, which is the correct outcome.
            DATE_INPUT=$(TZ="America/New_York" date +%F)
          fi
          echo "date=$DATE_INPUT" >> "$GITHUB_OUTPUT"
          echo "Resolved NFL slate date: $DATE_INPUT"

      # Ratings, moneyline / totals / spread picks, team stats by division,
      # the injury report and completed results. Writes data/nfl/*.json.
      # Is there anything to do today? A scheduled run always starts -- GitHub
      # gives no way to skip the trigger -- so the job asks first and stops in
      # seconds on a day with no games, spending no odds credits. "unknown"
      # (feed unreadable) runs the slate as usual rather than skipping a real one.
      - name: Any games today?
        id: slate
        run: |
          GAMES=$(node scripts/nfl-slate-size.js "${{ steps.slate_date.outputs.date }}" || echo unknown)
          echo "Games scheduled: $GAMES"
          echo "games=$GAMES" >> "$GITHUB_OUTPUT"
          if [ "$GAMES" = "0" ]; then
            echo "Nothing to do today. Skipping the gather."
          fi

      - name: Team ratings, game models, injuries and results
        if: steps.slate.outputs.games != '0'
        run: node scripts/generate-nfl-model.js "${{ steps.slate_date.outputs.date }}"

      # Player props: passing, rushing, receiving yards and anytime TD.
      - name: Player prop projections
        if: steps.slate.outputs.games != '0'
        run: node scripts/generate-nfl-props.js "${{ steps.slate_date.outputs.date }}"

      # Permanent per-game stat pages: last season beside this season, the
      # starting QB, RB / WR1 / WR2 and each side's touchdown leaders.
      # Player prop MARKET LINES. This is the only NFL step that spends
      # the-odds-api credits: player props are billed per EVENT at
      # [markets] x [regions], so a 14-game slate x 4 markets x 1 region is
      # ~56 credits per run. Mirrors the MLB split deliberately -- gathering
      # spends, publishing does not (see publish-picks.yml).
      #
      # `|| true`: a dry key, a quota wall or a provider outage must not fail
      # the whole gather. Props stay publishable without lines; they simply
      # carry no lean, and the merge step below no-ops when the file is absent.
      - name: Player prop market lines
        if: steps.slate.outputs.games != '0'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
        run: node scripts/update-nfl-props-odds.js --date="${{ steps.slate_date.outputs.date }}" || true

      # Attach those lines to our projections and state an over/under lean.
      # Costs nothing -- pure local join. Prints every unmatched name rather
      # than swallowing it (NFL_WATCH_LIST #23).
      - name: Attach lines to projections
        if: steps.slate.outputs.games != '0'
        run: node scripts/merge-nfl-prop-lines.js --date="${{ steps.slate_date.outputs.date }}" || true

      - name: Matchup data and pages
        if: steps.slate.outputs.games != '0'
        run: |
          node scripts/generate-nfl-matchups.js "${{ steps.slate_date.outputs.date }}"
          node scripts/render-nfl-matchup-pages.js "${{ steps.slate_date.outputs.date }}"
          node scripts/build-game-archives.js nfl
          node scripts/generate-sitemap.js

      # The owner's PDF brief (DEC-20261031-09): Leo's read of the slate with
      # the lines this capture just attached, emailed to the AUDIT_EMAIL secret.
      # Once per date, only from the capture within 3 hours of the first
      # kickoff (or within 9 hours on a night-only day: the midday gather), never after kickoff.
      # Headless Chrome ships on ubuntu-latest. Never fails the gather.
      - name: Email the owner brief (PDF)
        if: steps.slate.outputs.games != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AUDIT_EMAIL: ${{ secrets.AUDIT_EMAIL }}
        run: node scripts/send-nfl-owner-brief.js "${{ steps.slate_date.outputs.date }}" || true

      - name: Commit and push if changed
        if: steps.slate.outputs.games != '0'
        run: |
          set -euo pipefail
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data/nfl
          git add -A
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "NFL prepare slate ${{ steps.slate_date.outputs.date }}"
          git pull --rebase
          git push

      # EARLY READS (DEC-20261102-05, SEO-04): game pages for the rest of the
      # week from the daily morning wave, so "X vs Y prediction" pages exist
      # from Tuesday. Writes picks-<date>.json and the pages only: no -today
      # files, no prediction history, no prop lines, no emails. Game-day
      # gathers replace them with the frozen read. Never fails the gather.
      - name: Early reads and game pages for the next 6 days
        if: github.event.schedule == '53 12 * * *' || github.event.inputs.early == 'true'
        run: |
          set -uo pipefail
          git pull --rebase -q || true
          built=0
          for d in 1 2 3 4 5 6; do
            D=$(TZ="America/New_York" date -d "+$d day" +%F)
            N=$(node scripts/nfl-slate-size.js "$D" || echo unknown)
            if [ "$N" = "0" ] || [ "$N" = "unknown" ]; then continue; fi
            echo "Early read for $D ($N games)"
            node scripts/generate-nfl-model.js "$D" --early &&
            node scripts/generate-nfl-matchups.js "$D" --early &&
            node scripts/render-nfl-matchup-pages.js "$D" --early && built=$((built+1)) || echo "::warning::early read for $D failed"
          done
          if [ "$built" = "0" ]; then echo "No early reads built."; exit 0; fi
          node scripts/build-game-archives.js nfl || true
          node scripts/generate-sitemap.js || true
          git config user.name "lydia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No change to commit."; exit 0; fi
          git commit -m "NFL early reads"
          git pull --rebase
          git push || echo "::warning::early reads not pushed"
