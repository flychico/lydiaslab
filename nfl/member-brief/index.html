<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Member Brief — NFL | Leo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<style>
body { background: var(--bg); }
main { padding: 20px; max-width: 1000px; margin: 0 auto; }
.brief-header { margin-bottom: 24px; }
.brief-header h1 { margin: 0 0 8px; }
.brief-header .date { color: var(--text-dim); font-size: 0.95rem; }
.game-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.game-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; color: var(--text); }
.props-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.prop { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
.prop-type { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
.prop-value { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin: 6px 0; }
.prop-player { font-size: 0.9rem; color: var(--text); }
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.error { background: rgba(192, 57, 43, 0.1); border: 1px solid rgba(192, 57, 43, 0.3); color: #c0392b; padding: 16px; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="brief-header">
    <h1>Daily Member Brief — NFL</h1>
    <div class="date" id="brief-date">Loading…</div>
  </div>
  
  <div id="brief-content">
    <div class="loading">Loading tomorrow's NFL card…</div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderNav("/nfl/member-brief/");

// Load and display NFL props
async function loadBrief() {
  try {
    const res = await fetch('/data/nfl/props-today.json');
    if (!res.ok) throw new Error('Props not found');
    
    const allProps = await res.json();
    if (!Array.isArray(allProps)) throw new Error('Invalid props data');
    
    // Group by matchup
    const byGame = {};
    allProps.forEach(prop => {
      const key = prop.matchup || 'Unknown';
      if (!byGame[key]) byGame[key] = [];
      byGame[key].push(prop);
    });
    
    // Render
    let html = '';
    Object.entries(byGame).forEach(([matchup, props]) => {
      const moneyline = props.find(p => p.market === 'MONEYLINE'); // not currently generated
      const qbProps = props.filter(p => p.market === 'QB_PASS_YARDS');
      const wrProps = props.filter(p => p.market === 'WR_REC_YARDS');
      const rbProps = props.filter(p => p.market === 'RB_RUSH_YARDS');
      const tdProps = props.filter(p => p.market === 'ANYTIME_TD');
      
      html += `<div class="game-section">
        <div class="game-title">⚔️ ${matchup}</div>
        <div class="props-grid">`;
      
      if (moneyline) {
        html += `<div class="prop">
          <div class="prop-type">Moneyline</div>
          <div class="prop-value">${(moneyline.projection * 100).toFixed(1)}%</div>
          <div class="prop-player">Home Win Prob</div>
        </div>`;
      }
      
      qbProps.forEach(p => {
        html += `<div class="prop">
          <div class="prop-type">QB Pass Yards</div>
          <div class="prop-value">${p.projection}</div>
          <div class="prop-player">${p.player}</div>
        </div>`;
      });
      
      wrProps.forEach(p => {
        html += `<div class="prop">
          <div class="prop-type">WR Rec Yards</div>
          <div class="prop-value">${p.projection}</div>
          <div class="prop-player">${p.player}</div>
        </div>`;
      });
      
      rbProps.forEach(p => {
        html += `<div class="prop">
          <div class="prop-type">RB Rush Yards</div>
          <div class="prop-value">${p.projection}</div>
          <div class="prop-player">${p.player}</div>
        </div>`;
      });
      
      tdProps.forEach(p => {
        html += `<div class="prop">
          <div class="prop-type">Anytime TD</div>
          <div class="prop-value">${(p.projection * 100).toFixed(1)}%</div>
          <div class="prop-player">${p.player}</div>
        </div>`;
      });
      
      html += `</div></div>`;
    });
    
    document.getElementById('brief-content').innerHTML = html;
    document.getElementById('brief-date').textContent = 'September 20, 2026';
  } catch (err) {
    document.getElementById('brief-content').innerHTML = `<div class="error">Error loading props: ${err.message}</div>`;
  }
}

loadBrief();
</script>
</body>
</html>
