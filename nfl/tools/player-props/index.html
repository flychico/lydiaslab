<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Props — NFL | Leo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<style>
body { background: var(--bg); }
main { padding: 20px; max-width: 1200px; margin: 0 auto; }
.props-header { margin-bottom: 24px; }
.props-header h1 { margin: 0 0 8px; }
.props-header .date { color: var(--text-dim); font-size: 0.95rem; }
.prop-type-section { margin-bottom: 32px; }
.prop-type-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 16px; color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.props-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.prop-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.prop-matchup { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.prop-player { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.prop-value { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
.prop-type { font-size: 0.8rem; color: var(--text-dim); }
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.error { background: rgba(192, 57, 43, 0.1); border: 1px solid rgba(192, 57, 43, 0.3); color: #c0392b; padding: 16px; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="props-header">
    <h1>Player Props — NFL</h1>
    <div class="date" id="props-date">Loading…</div>
  </div>
  
  <div id="props-content">
    <div class="loading">Loading tomorrow's NFL player props…</div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderNav("/nfl/tools/player-props/");

async function loadProps() {
  try {
    const res = await fetch('/data/nfl/props-2026-09-20.json');
    if (!res.ok) throw new Error('Props not found');
    
    const allProps = await res.json();
    if (!Array.isArray(allProps)) throw new Error('Invalid props data');
    
    document.getElementById('props-date').textContent = new Date().toLocaleDateString('en-US', { 
      weekday: 'long', 
      month: 'long', 
      day: 'numeric',
      year: 'numeric'
    });
    
    const byType = {};
    allProps.forEach(prop => {
      const typeLabel = formatPropType(prop.type);
      if (!byType[typeLabel]) byType[typeLabel] = [];
      byType[typeLabel].push(prop);
    });
    
    let html = '';
    const propTypeOrder = ['QB Pass Yards', 'WR Receiving Yards', 'RB Rushing Yards', 'Anytime TD', 'Moneyline', 'Other'];
    
    propTypeOrder.forEach(typeLabel => {
      const props = byType[typeLabel] || [];
      if (props.length === 0) return;
      
      html += `<div class="prop-type-section">
        <div class="prop-type-title">${typeLabel}</div>
        <div class="props-grid">`;
      
      props.forEach(prop => {
        const value = formatValue(prop.projection, prop.type);
        html += `<div class="prop-card">
          <div class="prop-matchup">${prop.matchup || 'Unknown'}</div>
          <div class="prop-player">${prop.player || 'Team'}</div>
          <div class="prop-value">${value}</div>
          <div class="prop-type">${prop.type.replace(/_/g, ' ')}</div>
        </div>`;
      });
      
      html += '</div></div>';
    });
    
    document.getElementById('props-content').innerHTML = html || '<div class="error">No props available for tomorrow</div>';
  } catch (error) {
    document.getElementById('props-content').innerHTML = `<div class="error">Error loading props: ${error.message}</div>`;
  }
}

function formatPropType(type) {
  const map = {
    'QB_PASS_YARDS': 'QB Pass Yards',
    'WR_RECEIVING_YARDS': 'WR Receiving Yards',
    'RB_RUSHING_YARDS': 'RB Rushing Yards',
    'ANYTIME_TD': 'Anytime TD',
    'MONEYLINE': 'Moneyline'
  };
  return map[type] || type;
}

function formatValue(projection, type) {
  if (type === 'MONEYLINE' || type === 'ANYTIME_TD') {
    return (projection * 100).toFixed(1) + '%';
  }
  return Math.round(projection);
}

loadProps();
</script>
</body>
</html>
