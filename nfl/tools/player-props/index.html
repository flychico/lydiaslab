<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Props — NFL | Leo</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/style.css">
<style>
body { background: var(--bg); }
main { padding: 20px; max-width: 1200px; margin: 0 auto; }
.props-header { margin-bottom: 24px; }
.props-header h1 { margin: 0 0 8px; }
.props-header .date { color: var(--text-dim); font-size: 0.95rem; }
.prop-type-section { margin-bottom: 32px; }
.prop-type-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 16px; color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.props-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.prop-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.prop-matchup { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.prop-player { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.prop-value { font-size: 1.4rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
.prop-type { font-size: 0.8rem; color: var(--text-dim); }
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.error { background: rgba(192, 57, 43, 0.1); border: 1px solid rgba(192, 57, 43, 0.3); color: #c0392b; padding: 16px; border-radius: 6px; margin: 16px 0; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="props-header">
    <h1>Player Props — NFL</h1>
    <div class="date" id="props-date">Loading…</div>
  </div>
  
  <div id="props-content">
    <div class="loading">Loading tomorrow's NFL player props…</div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderNav("/nfl/tools/player-props/");

const LABELS = {
  QB_PASS_YARDS:  "QB Passing Yards",
  RB_RUSH_YARDS:  "RB Rushing Yards",
  WR_REC_YARDS:   "WR Receiving Yards",
  ANYTIME_TD:     "Anytime Touchdown"
};
const ORDER = ["QB_PASS_YARDS","RB_RUSH_YARDS","WR_REC_YARDS","ANYTIME_TD"];

function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function localISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(v, market){ return market==="ANYTIME_TD" ? (v*100).toFixed(1)+"%" : Math.round(v); }

async function tryJson(url){
  try { const r = await fetch(url, {cache:"no-store"}); return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}

async function loadProps(){
  const el = document.getElementById("props-content");
  // today, then tomorrow, then the rolling file the generator always writes
  const today = new Date();
  const tomorrow = new Date(Date.now()+864e5);
  const candidates = [
    "/data/nfl/props-"+localISO(today)+".json",
    "/data/nfl/props-"+localISO(tomorrow)+".json",
    "/data/nfl/props-today.json"
  ];
  let props=null, used=null;
  for (const u of candidates){ props = await tryJson(u); if (Array.isArray(props) && props.length){ used=u; break; } }

  if (!props || !props.length){
    el.innerHTML = '<div class="error">No NFL props are published right now. They post once the upcoming slate is generated.</div>';
    document.getElementById("props-date").textContent = "";
    return;
  }

  const d = props[0].date || "";
  document.getElementById("props-date").textContent =
    d ? new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}) : "";

  const byMarket = {};
  props.forEach(p => { (byMarket[p.market] = byMarket[p.market] || []).push(p); });

  let html = "";
  ORDER.forEach(market => {
    const list = (byMarket[market] || []).slice().sort((a,b) => b.projection - a.projection);
    if (!list.length) return;
    html += '<div class="prop-type-section"><div class="prop-type-title">'+esc(LABELS[market]||market)+
            ' <span style="font-weight:500;color:var(--text-dim);font-size:.85rem">('+list.length+')</span></div><div class="props-grid">';
    list.forEach(p => {
      const vol = (p.rate_used!=null && p.expected_volume!=null)
        ? esc(p.rate_used)+" \u00d7 "+esc(p.expected_volume)+" vol" : "";
      html += '<div class="prop-card">'+
        '<div class="prop-matchup">'+esc(p.matchup)+'</div>'+
        '<div class="prop-player">'+esc(p.player)+' <span style="color:var(--text-dim);font-weight:500">'+esc(p.team)+'</span></div>'+
        '<div class="prop-value">'+fmt(p.projection, p.market)+'</div>'+
        '<div class="prop-type">vs '+esc(p.opponent)+' \u00b7 opp adj '+esc(p.opp_adjustment)+(vol?' \u00b7 '+vol:'')+'</div>'+
      '</div>';
    });
    html += "</div></div>";
  });

  el.innerHTML = html;
  const note = document.createElement("p");
  note.style.cssText = "margin-top:22px;color:var(--text-dim);font-size:.8rem;text-align:center";
  note.textContent = "Projections blend recent form, season-to-date and prior-season baselines, shrunk toward league means and adjusted for opponent. Source: nflverse.";
  el.appendChild(note);
}
loadProps();
</script>
</body>
</html>
